" fill="#843C0C" font-size="10" text-anchor="middle">Gating</text><text x="435" y="90" fill="#333" font-family="monospace" font-size="24" font-weight="bold">→</text><rect width="60" height="50" x="465" y="60" fill="#EBF1E4" stroke="#375623" stroke-width="1.5" rx="0"/><text x="495" y="86" fill="#375623" font-size="16" font-weight="bold" text-anchor="middle">Fb</text><text x="495" y="100" fill="#375623" font-size="10" text-anchor="middle">Feedback</text><text x="535" y="90" fill="#333" font-family="monospace" font-size="24" font-weight="bold">(</text><rect width="50" height="40" x="555" y="65" fill="#E9EFF7" stroke="#2F5496" stroke-width="1.5" rx="0"/><text x="580" y="86" fill="#2F5496" font-size="14" font-weight="bold" text-anchor="middle">Hs</text><text x="580" y="98" fill="#2F5496" font-size="9" text-anchor="middle">Hidden</text><text x="615" y="90" fill="#333" font-family="monospace" font-size="24" font-weight="bold">)</text></svg>