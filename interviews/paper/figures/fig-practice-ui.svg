<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, Helvetica Neue, Arial, sans-serif" viewBox="0 0 980 548"><defs><filter id="sh" width="104%" height="104%" x="-2%" y="-2%"><feDropShadow dx="0" dy="1" flood-opacity=".12" stdDeviation="1.2"/></filter></defs><rect width="980" height="548" fill="#fff" rx="4"/><rect width="188" height="520" x="12" y="12" fill="#f8f9fa" stroke="#d4d5db" stroke-width="1" filter="url(#sh)" rx="6"/><text x="20" y="30" fill="#7a7b8e" font-family="JetBrains Mono, Consolas, monospace" font-size="9" font-weight="600" letter-spacing=".12em">TRACK</text><rect width="168" height="24" x="20" y="36" fill="rgba(37,99,235,0.1)" stroke="rgba(37,99,235,0.45)" stroke-width="1" rx="4"/><text x="28" y="52" fill="#2563eb" font-size="11" font-weight="600">cloud</text><text x="180" y="52" fill="#a0a1b0" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="end">3,521</text><text x="28" y="76" fill="#4a4b5c" font-size="11">edge</text><text x="180" y="76" fill="#a0a1b0" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="end">891</text><text x="28" y="98" fill="#4a4b5c" font-size="11">mobile</text><text x="180" y="98" fill="#a0a1b0" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="end">412</text><text x="28" y="120" fill="#4a4b5c" font-size="11">tinyml</text><text x="180" y="120" fill="#a0a1b0" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="end">1,104</text><text x="20" y="146" fill="#7a7b8e" font-family="JetBrains Mono, Consolas, monospace" font-size="9" font-weight="600" letter-spacing=".1em">DIFFICULTY</text><g font-size="9"><rect width="52" height="22" x="20" y="152" fill="#fff" stroke="#d4d5db" rx="3"/><text x="46" y="167" fill="#4a4b5c" font-family="JetBrains Mono, monospace" text-anchor="middle">L1</text><rect width="52" height="22" x="76" y="152" fill="#fff" stroke="#d4d5db" rx="3"/><text x="102" y="167" fill="#4a4b5c" font-family="JetBrains Mono, monospace" text-anchor="middle">L2</text><rect width="52" height="22" x="132" y="152" fill="#fff" stroke="#d4d5db" rx="3"/><text x="158" y="167" fill="#4a4b5c" font-family="JetBrains Mono, monospace" text-anchor="middle">L3</text><rect width="52" height="22" x="20" y="176" fill="rgba(251,146,60,0.12)" stroke="rgba(234,88,12,0.55)" stroke-width="1.2" rx="3"/><text x="46" y="191" fill="#ea580c" font-family="JetBrains Mono, monospace" font-weight="600" text-anchor="middle">L4</text><rect width="52" height="22" x="76" y="176" fill="#fff" stroke="#d4d5db" rx="3"/><text x="102" y="191" fill="#4a4b5c" font-family="JetBrains Mono, monospace" text-anchor="middle">L5</text><rect width="52" height="22" x="132" y="176" fill="#fff" stroke="#d4d5db" rx="3"/><text x="158" y="191" fill="#4a4b5c" font-family="JetBrains Mono, monospace" text-anchor="middle">L6+</text></g><text x="20" y="214" fill="#7a7b8e" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" letter-spacing=".1em">COMPETENCY</text><rect width="168" height="22" x="20" y="220" fill="rgba(37,99,235,0.1)" stroke="rgba(37,99,235,0.35)" rx="3"/><text x="28" y="235" fill="#2563eb" font-size="10" font-weight="500">All areas</text><text x="20" y="258" fill="#7a7b8e" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" letter-spacing=".1em">ZONE</text><rect width="168" height="22" x="20" y="264" fill="rgba(37,99,235,0.1)" stroke="rgba(37,99,235,0.35)" rx="3"/><text x="28" y="279" fill="#2563eb" font-size="10" font-style="normal" font-weight="500">diagnosis</text><text x="20" y="304" fill="#4a4b5c" font-size="10">☑ Napkin math only</text><text x="20" y="322" fill="#4a4b5c" font-size="10">☐ Visual questions only</text><text x="20" y="340" fill="#4a4b5c" font-size="10">☑ Chained questions only</text><text x="20" y="475" fill="#7a7b8e" font-family="JetBrains Mono, monospace" font-size="9">847 in pool</text><text x="20" y="492" fill="#a0a1b0" font-family="JetBrains Mono, monospace" font-size="8">· chains</text><rect width="500" height="520" x="210" y="12" fill="#fff" stroke="#d4d5db" stroke-width="1" filter="url(#sh)" rx="6"/><rect width="36" height="20" x="222" y="24" fill="rgba(251,146,60,0.2)" stroke="rgba(234,88,12,0.45)" stroke-width="1" rx="4"/><text x="240" y="38" fill="#ea580c" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" text-anchor="middle">L4</text><rect width="86" height="20" x="264" y="24" fill="#f8f9fa" stroke="#d4d5db" rx="3"/><text x="268" y="38" fill="#7a7b8e" font-family="JetBrains Mono, monospace" font-size="8" font-weight="500" lengthAdjust="spacing" textLength="78">SYSTEMS</text><rect width="78" height="20" x="356" y="24" fill="rgba(37,99,235,0.08)" stroke="rgba(37,99,235,0.25)" rx="3"/><text x="360" y="38" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="8" font-weight="500">diagnosis</text><text x="444" y="38" fill="#7a7b8e" font-family="JetBrains Mono, monospace" font-size="8">cloud</text><text x="702" y="38" fill="#4a4b5c" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="end">Report</text><text x="224" y="56" fill="#7a7b8e" dominant-baseline="central" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing=".02em">PART 4 OF 6</text><g transform="translate(304, 56)"><circle cx="0" cy="0" r="4" fill="#3b82f6" stroke="#3b82f6" stroke-width="1"/><circle cx="14" cy="0" r="4" fill="#22c55e" stroke="#22c55e" stroke-width="1"/><circle cx="28" cy="0" r="4" fill="#eab308" stroke="#eab308" stroke-width="1"/><circle cx="42" cy="0" r="4" fill="#f97316" stroke="#f97316" stroke-width="1.4"/><circle cx="56" cy="0" r="3.5" fill="none" stroke="#b8b9c4" stroke-width="1.5" opacity=".85"/><circle cx="70" cy="0" r="3.5" fill="none" stroke="#b8b9c4" stroke-width="1.5" opacity=".5"/></g><text x="400" y="56" fill="#a0a1b0" dominant-baseline="central" font-family="JetBrains Mono, monospace" font-size="8">roofline-analysis · chain</text><text x="224" y="90" fill="#1a1b25" font-size="17" font-weight="700" letter-spacing="-.02em">Decode MFU is 8% at batch 16</text><text x="224" y="108" fill="#1a1b25" font-size="17" font-weight="700" letter-spacing="-.02em">— where is the roofline?</text><rect width="480" height="48" x="220" y="120" fill="rgba(37,99,235,0.06)" stroke="none" rx="0"/><line x1="220" x2="220" y1="120" y2="168" stroke="#2563eb" stroke-width="3"/><text x="232" y="135" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="8" font-weight="600" letter-spacing=".14em">YOUR TASK</text><text x="232" y="152" fill="#1a1b25" font-size="10" font-weight="500">Name the bound and show arithmetic intensity is below the ridge point.</text><text x="224" y="192" fill="#4a4b5c" font-size="11">Your production LLM serving reports ~8% MFU during decode at B≈16.</text><text x="224" y="208" fill="#4a4b5c" font-size="11">H100: 494 TFLOPS (dense TF32) · 3.35 TB/s HBM. Team suspects underclocking.</text><text x="224" y="224" fill="#4a4b5c" font-size="11">You think memory bandwidth — prove it with napkin math before peeking.</text><text x="224" y="250" fill="#7a7b8e" font-family="JetBrains Mono, monospace" font-size="8" font-weight="600" letter-spacing=".12em">YOUR NAPKIN MATH</text><rect width="468" height="100" x="224" y="256" fill="#f8f9fa" stroke="#d4d5db" stroke-width="1" rx="4"/><text x="236" y="278" fill="#4a4b5c" font-family="JetBrains Mono, Consolas, monospace" font-size="9"># weights ~140 GiB @ FP16 → one full pass per step reads ~140 GiB</text><text x="236" y="296" fill="#4a4b5c" font-family="JetBrains Mono, Consolas, monospace" font-size="9"># AI = B * FLOP/byte ~ 16 FLOP/B | H100 ridge ~ 148 FLOP/B</text><text x="236" y="314" fill="#4a4b5c" font-family="JetBrains Mono, Consolas, monospace" font-size="9"># ⇒ memory-bound; ceiling set by 3.35 TB/s, not 494 TFLOPS…</text><line x1="232" x2="680" y1="330" y2="330" stroke="#e2e3e8" stroke-width="1"/><text x="236" y="346" fill="#a0a1b0" font-family="JetBrains Mono, monospace" font-size="8" font-style="italic">Type final line as =&gt; 54e12 to check against model (⌘↵)</text><rect width="468" height="32" x="224" y="364" fill="#1a1b25" rx="5"/><text x="458" y="384" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Reveal Answer</text><text x="676" y="384" fill="#a0a1b0" font-family="JetBrains Mono, monospace" font-size="8" opacity=".95" text-anchor="end">⌘↵</text><text x="224" y="414" fill="#7a7b8e" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="start">Stuck? Ask Interviewer in the tools panel →</text><text x="692" y="414" fill="#7a7b8e" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="end">12 in pool · Next N</text><line x1="220" x2="700" y1="516" y2="516" stroke="#e2e3e8" stroke-width="1"/><text x="460" y="530" fill="#a0a1b0" font-family="Inter, sans-serif" font-size="7.5" font-style="italic" text-anchor="middle">Filters (left) slice the corpus; centre = commit-then-reveal loop; right = tools.</text><rect width="246" height="520" x="722" y="12" fill="#f8f9fa" stroke="#d4d5db" stroke-width="1" filter="url(#sh)" rx="6"/><line x1="722" x2="968" y1="48" y2="48" stroke="#d4d5db" stroke-width="1"/><text x="726" y="32" fill="#7a7b8e" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" letter-spacing=".12em">TOOLS</text><text x="966" y="32" fill="#a0a1b0" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="end">Skip ⏭</text><rect width="242" height="102" x="724" y="54" fill="#fff" stroke="#d4d5db" rx="4"/><text x="730" y="70" fill="#7a7b8e" font-family="JetBrains Mono, monospace" font-size="8" font-weight="600" letter-spacing=".1em">HARDWARE REF</text><text x="960" y="70" fill="#059669" font-size="7" text-anchor="end">open</text><text x="730" y="90" fill="#4a4b5c" font-family="JetBrains Mono, monospace" font-size="9">H100 · HBM3e 3.35 TB/s</text><text x="730" y="106" fill="#4a4b5c" font-family="JetBrains Mono, monospace" font-size="9">Peak TF32: 494 T → ridge ~148 F/B</text><text x="730" y="128" fill="#a0a1b0" font-size="7.5" font-style="italic">(table scrolls)</text><rect width="242" height="36" x="724" y="164" fill="#fff" stroke="#d4d5db" stroke-dasharray="3 2" rx="4"/><text x="730" y="186" fill="#7a7b8e" font-size="9" font-weight="500">Napkin calculator ▸</text><rect width="242" height="300" x="724" y="208" fill="#fff" stroke="#d4d5db" rx="4"/><text x="730" y="224" fill="#7a7b8e" font-family="JetBrains Mono, monospace" font-size="8" font-weight="600" letter-spacing=".08em">ASK INTERVIEWER</text><text x="958" y="224" fill="#a0a1b0" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="end">▾</text><rect width="230" height="48" x="730" y="232" fill="#fff7ed" stroke="#f59e0b" stroke-opacity=".45" stroke-width=".8" rx="3"/><text x="736" y="242" fill="#4a4b5c" font-size="6.25">Journal mode. Your clarifying questions are logged for</text><text x="736" y="252" fill="#4a4b5c" font-size="6.25">the post-mortem but no AI is wired. Use the <tspan fill="#1a1b25" font-weight="600">Copy as</tspan></text><text x="736" y="262" fill="#4a4b5c" font-size="6.25"><tspan fill="#1a1b25" font-weight="600">prompt</tspan> button below to ask in your own LLM.</text><rect width="230" height="86" x="730" y="288" fill="#fff" stroke="#d4d5db" rx="2"/><text x="736" y="300" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="6.5" font-weight="600">you</text><text x="736" y="312" fill="#1a1b25" font-size="6.5">Is batch B=16 the only decode batch, or can I</text><text x="736" y="324" fill="#1a1b25" font-size="6.5">assume larger B later?</text><text x="736" y="340" fill="#059669" font-family="JetBrains Mono, monospace" font-size="6.5" font-weight="600">interviewer</text><text x="736" y="352" fill="#4a4b5c" font-size="6.25">(journal mode) Your clarification is logged for the</text><text x="736" y="362" fill="#4a4b5c" font-size="6.25">post-mortem. Use the Copy-as-prompt button below to</text><text x="736" y="372" fill="#4a4b5c" font-size="6.25">ask in your own LLM.</text><rect width="230" height="44" x="730" y="382" fill="#fff" stroke="#d4d5db" rx="2"/><text x="736" y="394" fill="#a0a1b0" font-family="JetBrains Mono, monospace" font-size="6.25" font-style="italic">Ask a clarifying question — e.g. &apos;what&apos;s the latency</text><text x="736" y="404" fill="#a0a1b0" font-family="JetBrains Mono, monospace" font-size="6.25" font-style="italic">budget?&apos; or &apos;how many concurrent users?&apos;</text><text x="730" y="438" fill="#7a7b8e" font-family="JetBrains Mono, monospace" font-size="6.25">⌘↵ to send</text><rect width="58" height="16" x="860" y="428" fill="#fff" stroke="#d4d5db" rx="2"/><text x="889" y="439" fill="#4a4b5c" font-size="5.8" font-weight="500" text-anchor="middle">Copy as prompt</text><rect width="36" height="16" x="924" y="428" fill="#2563eb" rx="2"/><text x="942" y="439" fill="#fff" font-size="6.2" font-weight="700" text-anchor="middle">Ask</text><text x="730" y="458" fill="#7a7b8e" font-family="JetBrains Mono, monospace" font-size="5.9">Journal mode — nothing leaves your browser. Use</text><text x="730" y="468" fill="#7a7b8e" font-family="JetBrains Mono, monospace" font-size="5.9">Copy-as-prompt and paste into the LLM of your choice</text><text x="730" y="478" fill="#7a7b8e" font-family="JetBrains Mono, monospace" font-size="5.9">if you want answers.</text></svg>