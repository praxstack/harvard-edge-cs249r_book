<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 40 680 375"><rect width="680" height="460" fill="#fff"/><defs><marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#555" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arrow-green" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#10b981" d="M0,0 L8,3 L0,6 Z"/></marker></defs><rect width="180" height="70" x="30" y="50" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/><text x="120" y="70" fill="#333" font-size="10" font-weight="700" text-anchor="middle">Layer A: Workload</text><text x="120" y="84" fill="#555" font-size="8" text-anchor="middle">ModelSpec</text><text x="120" y="96" fill="#555" font-size="7.5" text-anchor="middle">Transformer 7B · FP16</text><text x="120" y="108" fill="#555" font-size="7.5" text-anchor="middle">14.0T FLOPs/step · 14 GB</text><rect width="180" height="70" x="30" y="140" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="120" y="160" fill="#333" font-size="10" font-weight="700" text-anchor="middle">Layer B: Hardware</text><text x="120" y="174" fill="#555" font-size="8" text-anchor="middle">AcceleratorSpec</text><text x="120" y="186" fill="#555" font-size="7.5" text-anchor="middle">H100 · 990 TFLOP/s</text><text x="120" y="198" fill="#555" font-size="7.5" text-anchor="middle">3.35 TB/s HBM · 80 GB</text><rect width="180" height="60" x="30" y="230" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="120" y="250" fill="#333" font-size="10" font-weight="700" text-anchor="middle">Layer C: Infrastructure</text><text x="120" y="264" fill="#555" font-size="8" text-anchor="middle">InfraSpec</text><text x="120" y="278" fill="#555" font-size="7.5" text-anchor="middle">Iowa · CI=680 g/kWh · PUE=1.1</text><line x1="210" x2="270" y1="85" y2="85" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="210" x2="270" y1="175" y2="175" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="210" x2="270" y1="260" y2="260" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="180" height="48" x="270" y="52" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><rect width="40" height="14" x="275" y="55" fill="#a31f34"/><text x="295" y="65" fill="#fff" font-size="7" font-weight="700" text-anchor="middle">W 1-2</text><text x="370" y="70" fill="#333" font-size="9" font-weight="700" text-anchor="middle">SingleNodeModel</text><text x="360" y="90" fill="#555" font-size="7.5" text-anchor="middle">→ Bottleneck: memory · MFU: 0.61</text><line x1="360" x2="360" y1="100" y2="118" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="180" height="48" x="270" y="118" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><rect width="28" height="14" x="275" y="121" fill="#a31f34"/><text x="289" y="131" fill="#fff" font-size="7" font-weight="700" text-anchor="middle">W 4</text><text x="370" y="136" fill="#333" font-size="9" font-weight="700" text-anchor="middle">ServingModel</text><text x="360" y="156" fill="#555" font-size="7.5" text-anchor="middle">→ TTFT: 12ms · ITL: 22ms</text><line x1="360" x2="360" y1="166" y2="184" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="180" height="48" x="270" y="184" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><rect width="32" height="14" x="275" y="187" fill="#a31f34"/><text x="291" y="197" fill="#fff" font-size="7" font-weight="700" text-anchor="middle">W 17</text><text x="370" y="202" fill="#333" font-size="9" font-weight="700" text-anchor="middle">EconomicsModel</text><text x="360" y="222" fill="#555" font-size="7.5" text-anchor="middle">→ TCO: $1.2M/yr · $0.003/query</text><line x1="360" x2="360" y1="232" y2="250" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="180" height="48" x="270" y="250" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><rect width="32" height="14" x="275" y="253" fill="#a31f34"/><text x="291" y="263" fill="#fff" font-size="7" font-weight="700" text-anchor="middle">W 18</text><text x="370" y="268" fill="#333" font-size="9" font-weight="700" text-anchor="middle">SustainabilityModel</text><text x="360" y="288" fill="#555" font-size="7.5" text-anchor="middle">→ CO₂: 412t · H₂O: 231 kL</text><line x1="450" x2="500" y1="175" y2="175" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect width="160" height="260" x="500" y="52" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="580" y="72" fill="#333" font-size="10" font-weight="700" text-anchor="middle">SystemEvaluation</text><text x="580" y="86" fill="#555" font-size="8" text-anchor="middle">Scorecard</text><line x1="510" x2="650" y1="92" y2="92" stroke="#10b981" stroke-width=".5" opacity=".4"/><text x="515" y="110" fill="#333" font-size="8.5" font-weight="700">Feasibility</text><text x="515" y="124" fill="#555" font-size="8">✓ Model fits in 80 GB HBM</text><text x="515" y="144" fill="#333" font-size="8.5" font-weight="700">Performance</text><text x="515" y="158" fill="#555" font-size="8">Bottleneck: memory</text><text x="515" y="170" fill="#555" font-size="8">MFU: 0.61</text><text x="515" y="190" fill="#333" font-size="8.5" font-weight="700">Latency</text><text x="515" y="204" fill="#555" font-size="8">TTFT: 12 ms</text><text x="515" y="216" fill="#555" font-size="8">ITL: 22 ms/token</text><text x="515" y="236" fill="#333" font-size="8.5" font-weight="700">Economics</text><text x="515" y="250" fill="#555" font-size="8">TCO: $1.2M/yr</text><text x="515" y="270" fill="#333" font-size="8.5" font-weight="700">Sustainability</text><text x="515" y="284" fill="#555" font-size="8">CO₂: 412 tonnes/yr</text><text x="515" y="296" fill="#555" font-size="8">H₂O: 231 kL/yr</text><rect width="630" height="50" x="30" y="330" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="345" y="350" fill="#333" font-size="9" font-weight="700" text-anchor="middle">Key: Each resolver is a pure function — typed inputs in, dimensionally correct outputs out.</text><text x="345" y="365" fill="#555" font-size="9" text-anchor="middle">Resolvers compose by chaining outputs → inputs. The type system enforces consistency at every boundary.</text><rect width="60" height="14" x="55" y="310" fill="#fff7ed" stroke="#d97706" stroke-width="1"/><text x="85" y="320" fill="#92400e" font-size="7.5" font-weight="700" text-anchor="middle">Demand</text><rect width="60" height="14" x="122" y="310" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/><text x="152" y="320" fill="#5b21b6" font-size="7.5" font-weight="700" text-anchor="middle">Supply</text><text x="340" y="400" fill="#999" font-size="9" font-style="italic" text-anchor="middle">Resolver chaining enables full-stack analysis: from silicon constraints through economics to environmental impact.</text></svg>