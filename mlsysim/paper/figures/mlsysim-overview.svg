5" stroke-width="1" d="M179,420 L191,420"/><path fill="#555" d="M187.5,417.5 L194.5,420 L187.5,422.5 z"/></g><g><path fill="#FFF7ED" d="M194.0,406.0 L256.0,406.0 L256.0,434.0 L194.0,434.0 z"/><path fill-opacity="0" stroke="#D97706" stroke-width="1" d="M194.0,406.0 L256.0,406.0 L256.0,434.0 L194.0,434.0 z"/></g><text x="225" y="424" fill="#333" font-size="7.5" text-anchor="middle">Scaling</text><g><path fill-opacity="0" stroke="#555" stroke-width="1" d="M256,420 L268,420"/><path fill="#555" d="M264.5,417.5 L271.5,420 L264.5,422.5 z"/></g><g><path fill="#F5F3FF" d="M271.0,406.0 L343.0,406.0 L343.0,434.0 L271.0,434.0 z"/><path fill-opacity="0" stroke="#7C3AED" stroke-width="1" d="M271.0,406.0 L343.0,406.0 L343.0,434.0 L271.0,434.0 z"/></g><text x="307" y="424" fill="#333" font-size="7.5" text-anchor="middle">Distributed</text><g><path fill-opacity="0" stroke="#555" stroke-width="1" d="M343,420 L355,420"/><path fill="#555" d="M351.5,417.5 L358.5,420 L351.5,422.5 z"/></g><g><path fill="#ECFDF5" d="M358.0,406.0 L430.0,406.0 L430.0,434.0 L358.0,434.0 z"/><path fill-opacity="0" stroke="#10B981" stroke-width="1" d="M358.0,406.0 L430.0,406.0 L430.0,434.0 L358.0,434.0 z"/></g><text x="394" y="424" fill="#333" font-size="7.5" text-anchor="middle">Economics</text><g><path fill-opacity="0" stroke="#555" stroke-width="1" d="M430,420 L442,420"/><path fill="#555" d="M438.5,417.5 L445.5,420 L438.5,422.5 z"/></g><g><path fill="#ECFDF5" d="M445.0,406.0 L517.0,406.0 L517.0,434.0 L445.0,434.0 z"/><path fill-opacity="0" stroke="#10B981" stroke-width="1" d="M445.0,406.0 L517.0,406.0 L517.0,434.0 L445.0,434.0 z"/></g><text x="481" y="424" fill="#333" font-size="7.5" text-anchor="middle">Sustain.</text><g><path fill-opacity="0" stroke="#A31F34" stroke-width="1.5" d="M517,420 L529,420"/><path fill="#A31F34" d="M525.5,417.5 L532.5,420 L525.5,422.5 z"/></g><g><path fill="#FFF" d="M532.0,402.0 L650.0,402.0 L650.0,438.0 L532.0,438.0 z"/><path fill-opacity="0" stroke="#A31F34" stroke-width="1.8" d="M532.0,402.0 L650.0,402.0 L650.0,438.0 L532.0,438.0 z"/></g><text x="591" y="418" fill="#A31F34" font-size="8.5" text-anchor="middle">Binding Wall</text><text x="591" y="430" fill="#555" font-size="7" text-anchor="middle">scorecard + synthesis</text><text x="34" y="452" fill="#555" font-size="7.5">Three-level evaluation:</text><g><path fill="#ECFDF5" d="M145.0,442.0 L207.0,442.0 L207.0,458.0 L145.0,458.0 z"/><path fill-opacity="0" stroke="#10B981" stroke-width=".8" d="M145.0,442.0 L207.0,442.0 L207.0,458.0 L145.0,458.0 z"/></g><text x="176" y="453" fill="#333" font-size="7" text-anchor="middle">Feasibility</text><text x="220" y="453" fill="#555" font-size="7" text-anchor="middle">then</text><g><path fill="#E0F2FE" d="M232.0,442.0 L282.0,442.0 L282.0,458.0 L232.0,458.0 z"/><path fill-opacity="0" stroke="#0284C7" stroke-width=".8" d="M232.0,442.0 L282.0,442.0 L282.0,458.0 L232.0,458.0 z"/></g><text x="257" y="453" fill="#333" font-size="7" text-anchor="middle">Profile</text><text x="295" y="453" fill="#555" font-size="7" text-anchor="middle">then</text><g><path fill="#F5F3FF" d="M307.0,442.0 L357.0,442.0 L357.0,458.0 L307.0,458.0 z"/><path fill-opacity="0" stroke="#7C3AED" stroke-width=".8" d="M307.0,442.0 L357.0,442.0 L357.0,458.0 L307.0,458.0 z"/></g><text x="332" y="453" fill="#333" font-size="7" text-anchor="middle">Fleet</text><text x="30" y="482" fill="#333" font-size="10">(d) Example: LLaMA-3 70B on 1024x H100</text><g><path fill="#FFF" d="M20.0,488.0 L220.0,488.0 L220.0,532.0 L20.0,532.0 z"/><path fill-opacity="0" stroke="#A31F34" stroke-width="1.5" d="M20.0,488.0 L220.0,488.0 L220.0,532.0 L20.0,532.0 z"/></g><text x="120" y="504" fill="#A31F34" font-size="8.5" text-anchor="middle">Binding: Wall 2</text><text x="120" y="518" fill="#555" font-size="7.5" text-anchor="middle">HBM BW = 3.35 TB/s ceiling</text><g><path fill="#E0F2FE" d="M240.0,488.0 L440.0,488.0 L440.0,532.0 L240.0,532.0 z"/><path fill-opacity="0" stroke="#0284C7" stroke-width="1.2" d="M240.0,488.0 L440.0,488.0 L440.0,532.0 L240.0,532.0 z"/></g><text x="340" y="504" fill="#333" font-size="8.5" text-anchor="middle">Sensitivity</text><text x="340" y="518" fill="#555" font-size="7.5" text-anchor="middle">dT/dBW dominates; dT/dFLOPS = 0 (memory-bound)</text><g><path fill="#ECFDF5" d="M460.0,488.0 L660.0,488.0 L660.0,532.0 L460.0,532.0 z"/><path fill-opacity="0" stroke="#10B981" stroke-width="1.2" d="M460.0,488.0 L660.0,488.0 L660.0,532.0 L460.0,532.0 z"/></g><text x="560" y="504" fill="#333" font-size="8.5" text-anchor="middle">Synthesis</text><text x="560" y="518" fill="#555" font-size="7.5" text-anchor="middle">50 ms ITL SLA: need 2.8 TB/s BW</text><g><path fill="#ECFDF5" d="M20.0,540.0 L330.0,540.0 L330.0,566.0 L20.0,566.0 z"/><path fill-opacity="0" stroke="#10B981" stroke-width="1.2" d="M20.0,540.0 L330.0,540.0 L330.0,566.0 L20.0,566.0 z"/></g><text x="175" y="557" fill="#333" font-size="7.5" text-anchor="middle">Sustainability: 147 tCO2 + 0.6M L water + $1.0M run TCO (30d, US grid)</text><g><path fill="#F8FAFC" d="M350.0,540.0 L660.0,540.0 L660.0,566.0 L350.0,566.0 z"/><path fill-opacity="0" stroke="#CBD5E1" stroke-width="1.2" d="M350.0,540.0 L660.0,540.0 L660.0,566.0 L350.0,566.0 z"/></g><text x="505" y="557" fill="#333" font-size="7.5" text-anchor="middle">Reliability: MTBF = 9.8h @ 1024 GPUs, ckpt every ~14 min</text><text x="340" y="578" fill="#999" font-size="8.5" font-style="italic" text-anchor="middle">All outputs produced in &lt;0.3s on a laptop. No GPU required.</text></g></svg>