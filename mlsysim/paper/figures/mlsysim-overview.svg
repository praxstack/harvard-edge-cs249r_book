<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="680" height="590" x="0" y="0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" version="1.1" viewBox="0 0 680 590"><g id="Layer_1"><path fill="#FFF" d="M0.0,0.0 L680.0,0.0 L680.0,590.0 L0.0,590.0 z"/><text x="30" y="16" fill="#333" font-size="10">(a) Demand-Supply Separation</text><g><path fill="#FFF7ED" d="M30.0,24.0 L325.0,24.0 L325.0,74.0 L30.0,74.0 z"/><path fill-opacity="0" stroke="#D97706" stroke-width="1.5" d="M30.0,24.0 L325.0,24.0 L325.0,74.0 L30.0,74.0 z"/></g><text x="177" y="42" fill="#333" font-size="10" text-anchor="middle">Demand (Workload)</text><text x="177" y="57" fill="#555" font-size="8" text-anchor="middle">W = (P, D, S, L, H, A, B): parameters, tokens, layers, heads, batch</text><g><path fill="#F5F3FF" d="M355.0,24.0 L650.0,24.0 L650.0,74.0 L355.0,74.0 z"/><path fill-opacity="0" stroke="#7C3AED" stroke-width="1.5" d="M355.0,24.0 L650.0,24.0 L650.0,74.0 L355.0,74.0 z"/></g><text x="502" y="42" fill="#333" font-size="10" text-anchor="middle">Supply (Hardware)</text><text x="502" y="57" fill="#555" font-size="8" text-anchor="middle">H = (F, BW, C, TDP): FLOP/s, bandwidth, capacity, power</text><g><path fill="#F8FAFC" d="M140.0,82.0 L540.0,82.0 L540.0,112.0 L140.0,112.0 z"/><path fill-opacity="0" stroke="#94A3B8" stroke-width="1.2" d="M140.0,82.0 L540.0,82.0 L540.0,112.0 L140.0,112.0 z"/></g><text x="340" y="100" fill="#333" font-size="8.5" text-anchor="middle">Infrastructure (N, PUE, CI, $/kWh) + Systems (topology, parallelism)</text><g><path fill-opacity="0" stroke="#555" stroke-width="1" d="M177,74 L177,82"/><path fill="#555" d="M179.5,78.5 L177,85.5 L174.5,78.5 z"/></g><g><path fill-opacity="0" stroke="#555" stroke-width="1" d="M502,74 L502,82"/><path fill="#555" d="M504.5,78.5 L502,85.5 L499.5,78.5 z"/></g><g><path fill-opacity="0" stroke="#555" stroke-width="1.2" d="M340,112 L340,128"/><path fill="#555" d="M342.5,124.5 L340,131.5 L337.5,124.5 z"/></g><text x="30" y="126" fill="#333" font-size="10">(b) 22 Systems Walls</text><text x="340" y="126" fill="#999" font-size="8" font-style="italic" text-anchor="middle">6 domains, each wall = physical/logical constraint with a grounded equation</text><g><path fill="#F7F7F7" d="M20.0,131.5 L660.0,131.5 L660.0,371.5 L20.0,371.5 z"/><path fill-opacity="0" stroke="#BBB" stroke-width="1" d="M20.0,131.5 L660.0,131.5 L660.0,371.5 L20.0,371.5 z"/></g><g><path fill="#E0F2FE" d="M32.0,146.0 L330.0,146.0 L330.0,218.0 L32.0,218.0 z"/><path fill-opacity="0" stroke="#0284C7" stroke-width="1.2" d="M32.0,146.0 L330.0,146.0 L330.0,218.0 L32.0,218.0 z"/></g><text x="42" y="161" fill="#333" font-size="9">Node</text><text x="325" y="161" fill="#0284C7" font-size="7" font-style="italic" text-anchor="end">single-accelerator ceilings</text><text x="42" y="176" fill="#555" font-size="7.5">W1 Compute W2 Memory W3 Software W4 Serving</text><text x="42" y="188" fill="#555" font-size="7.5">W5 Batching W6 Streaming W7 Tail Latency</text><path fill="#0284C7" d="M280.0,195.0 L324.0,195.0 L324.0,209.0 L280.0,209.0 z"/><text x="302" y="204" fill="#FFF" font-size="6.5" text-anchor="middle">7 walls</text><g><path fill="#E0F2FE" d="M350.0,146.0 L648.0,146.0 L648.0,190.0 L350.0,190.0 z"/><path fill-opacity="0" stroke="#0284C7" stroke-width="1.2" d="M350.0,146.0 L648.0,146.0 L648.0,190.0 L350.0,190.0 z"/></g><text x="360" y="161" fill="#333" font-size="9">Data</text><text x="643" y="161" fill="#0284C7" font-size="7" font-style="italic" text-anchor="end">movement and pipelines</text><text x="360" y="176" fill="#555" font-size="7.5">W8 Ingestion W9 Transformation W10 Locality</text><path fill="#0284C7" d="M598.0,171.0 L642.0,171.0 L642.0,185.0 L598.0,185.0 z"/><text x="620" y="180" fill="#FFF" font-size="6.5" text-anchor="middle">3 walls</text><g><path fill="#FFF7ED" d="M350.0,198.0 L648.0,198.0 L648.0,242.0 L350.0,242.0 z"/><path fill-opacity="0" stroke="#D97706" stroke-width="1.2" d="M350.0,198.0 L648.0,198.0 L648.0,242.0 L350.0,242.0 z"/></g><text x="360" y="213" fill="#333" font-size="9">Algorithm</text><text x="643" y="213" fill="#92400E" font-size="7" font-style="italic" text-anchor="end">scaling and compression</text><text x="360" y="228" fill="#555" font-size="7.5">W11 Complexity W12 Reasoning W13 Fidelity</text><path fill="#D97706" d="M598.0,223.0 L642.0,223.0 L642.0,237.0 L598.0,237.0 z"/><text x="620" y="232" fill="#FFF" font-size="6.5" text-anchor="middle">3 walls</text><g><path fill="#F5F3FF" d="M32.0,226.0 L330.0,226.0 L330.0,270.0 L32.0,270.0 z"/><path fill-opacity="0" stroke="#7C3AED" stroke-width="1.2" d="M32.0,226.0 L330.0,226.0 L330.0,270.0 L32.0,270.0 z"/></g><text x="42" y="241" fill="#333" font-size="9">Fleet</text><text x="325" y="241" fill="#5B21B6" font-size="7" font-style="italic" text-anchor="end">multi-node coordination</text><text x="42" y="256" fill="#555" font-size="7.5">W14 Communication W15 Fragility W16 Multi-tenant</text><path fill="#7C3AED" d="M280.0,251.0 L324.0,251.0 L324.0,265.0 L280.0,265.0 z"/><text x="302" y="260" fill="#FFF" font-size="6.5" text-anchor="middle">3 walls</text><g><path fill="#ECFDF5" d="M32.0,278.0 L330.0,278.0 L330.0,345.846 L32.0,345.846 z"/><path fill-opacity="0" stroke="#10B981" stroke-width="1.2" d="M32.0,278.0 L330.0,278.0 L330.0,345.846 L32.0,345.846 z"/></g><text x="42" y="293" fill="#333" font-size="9">Ops</text><text x="325" y="293" fill="#047857" font-size="7" font-style="italic" text-anchor="end">economics, sustainability, safety</text><text x="42" y="308" fill="#555" font-size="7.5">W17 Capital W18 Sustainability</text><text x="42" y="319" fill="#555" font-size="7.5">W19 Checkpoint W20 Safety</text><path fill="#10B981" d="M280.0,324.0 L324.0,324.0 L324.0,338.0 L280.0,338.0 z"/><text x="302" y="333" fill="#FFF" font-size="6.5" text-anchor="middle">4 walls</text><g><path fill="#FFF" d="M350.0,250.0 L648.0,250.0 L648.0,322.0 L350.0,322.0 z"/><path fill-opacity="0" stroke="#A31F34" stroke-width="1.