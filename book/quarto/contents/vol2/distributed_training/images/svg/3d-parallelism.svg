<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 1040 440"><defs><marker id="arrow" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><path fill="#555" d="M0,0 L10,3.5 L0,7 Z"/></marker><marker id="arrow-blue" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><path fill="#4a90c4" d="M0,0 L10,3.5 L0,7 Z"/></marker><marker id="arrow-green" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><path fill="#3d9e5a" d="M0,0 L10,3.5 L0,7 Z"/></marker><marker id="arrow-orange" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><path fill="#c87b2a" d="M0,0 L10,3.5 L0,7 Z"/></marker><marker id="arrow-red" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><path fill="#c44" d="M0,0 L10,3.5 L0,7 Z"/></marker></defs><rect width="1040" height="440" fill="#fff"/><line x1="220" x2="560" y1="350" y2="350" stroke="#4a90c4" stroke-width="1.5" marker-end="url(#arrow-blue)"/><text x="390" y="342" fill="#4a90c4" font-size="11" font-weight="700" text-anchor="middle">Data Parallel (d)</text><line x1="40" x2="40" y1="115" y2="265" stroke="#c44" stroke-width="1.5" marker-end="url(#arrow-red)"/><text x="25" y="190" fill="#c44" font-size="11" font-weight="700" text-anchor="middle" transform="rotate(-90, 25, 190)">Pipeline Parallel (p)</text><rect width="280" height="270" x="80" y="50" fill="none" stroke="#bbb" stroke-dasharray="6 4" stroke-width="1.5"/><rect width="240" height="90" x="100" y="70" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/><line x1="160" x2="280" y1="85" y2="85" stroke="#c87b2a" stroke-width="1.5" marker-end="url(#arrow-orange)"/><text x="220" y="78" fill="#c87b2a" font-size="10" font-weight="700" text-anchor="middle">Tensor Parallel (t)</text><rect width="80" height="50" x="120" y="100" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/><text x="160" y="120" fill="#333" font-size="10" font-weight="700" text-anchor="middle">GPU 0</text><text x="160" y="136" fill="#555" font-size="9" text-anchor="middle">d=0,t=0,p=0</text><rect width="80" height="50" x="240" y="100" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.2"/><text x="280" y="120" fill="#333" font-size="10" font-weight="700" text-anchor="middle">GPU 2</text><text x="280" y="136" fill="#555" font-size="9" text-anchor="middle">d=0,t=1,p=0</text><rect width="240" height="90" x="100" y="210" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/><line x1="160" x2="280" y1="225" y2="225" stroke="#c87b2a" stroke-width="1.5" marker-end="url(#arrow-orange)"/><text x="220" y="218" fill="#c87b2a" font-size="10" font-weight="700" text-anchor="middle">Tensor Parallel (t)</text><rect width="80" height="50" x="120" y="240" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/><text x="160" y="270" fill="#333" font-size="10" font-weight="700" text-anchor="middle">GPU 4</text><text x="160" y="286" fill="#555" font-size="9" text-anchor="middle">d=0,t=0,p=1</text><rect width="80" height="50" x="240" y="240" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.2"/><text x="280" y="270" fill="#333" font-size="10" font-weight="700" text-anchor="middle">GPU 6</text><text x="280" y="286" fill="#555" font-size="9" text-anchor="middle">d=0,t=1,p=1</text><rect width="280" height="270" x="420" y="50" fill="none" stroke="#bbb" stroke-dasharray="6 4" stroke-width="1.5"/><rect width="240" height="90" x="440" y="70" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/><line x1="500" x2="620" y1="85" y2="85" stroke="#c87b2a" stroke-width="1.5" marker-end="url(#arrow-orange)"/><text x="560" y="78" fill="#c87b2a" font-size="10" font-weight="700" text-anchor="middle">Tensor Parallel (t)</text><rect width="80" height="50" x="460" y="100" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/><text x="500" y="120" fill="#333" font-size="10" font-weight="700" text-anchor="middle">GPU 1</text><text x="500" y="136" fill="#555" font-size="9" text-anchor="middle">d=1,t=0,p=0</text><rect width="80" height="50" x="580" y="100" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.2"/><text x="620" y="120" fill="#333" font-size="10" font-weight="700" text-anchor="middle">GPU 3</text><text x="620" y="136" fill="#555" font-size="9" text-anchor="middle">d=1,t=1,p=0</text><rect width="240" height="90" x="440" y="210" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/><line x1="500" x2="620" y1="225" y2="225" stroke="#c87b2a" stroke-width="1.5" marker-end="url(#arrow-orange)"/><text x="560" y="218" fill="#c87b2a" font-size="10" font-weight="700" text-anchor="middle">Tensor Parallel (t)</text><rect width="80" height="50" x="460" y="240" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/><text x="500" y="270" fill="#333" font-size="10" font-weight="700" text-anchor="middle">GPU 5</text><text x="500" y="286" fill="#555" font-size="9" text-anchor="middle">d=1,t=0,p=1</text><rect width="80" height="50" x="580" y="240" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.2"/><text x="620" y="270" fill="#333" font-size="10" font-weight="700" text-anchor="middle">GPU 7</text><text x="620" y="286" fill="#555" font-size="9" text-anchor="middle">d=1,t=1,p=1</text><rect width="260" height="200" x="740" y="50" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/><rect width="10" height="10" x="750" y="60" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1"/><text x="770" y="70" fill="#4a90c4" font-size="11" font-weight="700">Data Parallel (d = 2)</text><text x="770" y="84" fill="#555" font-size="9">Replicate model, split batch</text><text x="770" y="96" fill="#555" font-size="9">Sync: AllReduce gradients</text><text x="770" y="108" fill="#555" font-size="9">Interconnect: InfiniBand (inter-node)</text><rect width="10" height="10" x="750" y="120" fill="#f9d6d5" stroke="#c44" stroke-width="1"/><text x="770" y="130" fill="#c44" font-size="11" font-weight="700">Pipeline Parallel (p = 2)</text><text x="770" y="144" fill="#555" font-size="9">Partition layers across stages</text><text x="770" y="156" fill="#555" font-size="9">Sync: Point-to-point activations</text><text x="770" y="168" fill="#555" font-size="9">Interconnect: Ethernet sufficient</text><rect width="10" height="10" x="750" y="180" fill="#fdebd0" stroke="#c87b2a" stroke-width="1"/><text x="770" y="190" fill="#c87b2a" font-size="11" font-weight="700">Tensor Parallel (t = 2)</text><text x="770" y="204" fill="#555" font-size="9">Split layers (column/row)</text><text x="770" y="216" fill="#555" font-size="9">Sync: AllReduce per layer</text><text x="770" y="228" fill="#555" font-size="9">Interconnect: NVLink (intra-node)</text><rect width="260" height="50" x="740" y="260" fill="#e8f5e9" stroke="#2d7a2d" stroke-width="1.2"/><text x="870" y="280" fill="#2d7a2d" font-size="12" font-weight="700" text-anchor="middle">Total devices = d × p × t</text><text x="870" y="296" fill="#555" font-size="11" text-anchor="middle">2 × 2 × 2 = 8 GPUs</text><rect width="260" height="80" x="740" y="330" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/><text x="870" y="348" fill="#a31f34" font-size="10" font-weight="700" text-anchor="middle">Hardware Placement Rule</text><text x="750" y="364" fill="#555" font-size="9">TP within node (NVLink: 600 GB/s)</text><text x="750" y="378" fill="#555" font-size="9">PP across nodes (IB: 25 GB/s per port)</text><text x="750" y="392" fill="#555" font-size="9">DP across racks (Ethernet: 12.5 GB/s)</text><text x="520" y="390" fill="#999" font-size="10" font-style="italic" text-anchor="middle">Example: 2 DP replicas, each with 2 pipeline stages, each stage split across 2 tensor-parallel GPUs.</text><text x="520" y="406" fill="#999" font-size="10" font-style="italic" text-anchor="middle">Production configs (e.g., GPT-4): d=64, t=8, p=16 = 8,192 GPUs.</text></svg>