<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 760 480"><rect width="760" height="480" fill="#fff"/><defs><marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#333" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arrow-red" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#a31f34" d="M0,0 L8,3 L0,6 Z"/></marker></defs><text x="380" y="24" fill="#333" font-size="12" font-weight="700" text-anchor="middle">Build vs. Buy: Cumulative Cost Break-Even Analysis</text><text x="380" y="40" fill="#555" font-size="9" text-anchor="middle">125-node H100 cluster (1,000 GPUs) at 80% sustained utilization</text><line x1="80" x2="680" y1="380" y2="380" stroke="#e8e8e8" stroke-width=".8"/><line x1="80" x2="680" y1="320" y2="320" stroke="#e8e8e8" stroke-width=".8"/><line x1="80" x2="680" y1="260" y2="260" stroke="#e8e8e8" stroke-width=".8"/><line x1="80" x2="680" y1="200" y2="200" stroke="#e8e8e8" stroke-width=".8"/><line x1="80" x2="680" y1="140" y2="140" stroke="#e8e8e8" stroke-width=".8"/><line x1="80" x2="680" y1="80" y2="80" stroke="#e8e8e8" stroke-width=".8"/><line x1="80" x2="80" y1="80" y2="380" stroke="#e8e8e8" stroke-width=".8"/><line x1="200" x2="200" y1="80" y2="380" stroke="#e8e8e8" stroke-dasharray="2 3" stroke-width=".5"/><line x1="320" x2="320" y1="80" y2="380" stroke="#e8e8e8" stroke-dasharray="2 3" stroke-width=".5"/><line x1="440" x2="440" y1="80" y2="380" stroke="#e8e8e8" stroke-dasharray="2 3" stroke-width=".5"/><line x1="560" x2="560" y1="80" y2="380" stroke="#e8e8e8" stroke-dasharray="2 3" stroke-width=".5"/><line x1="680" x2="680" y1="80" y2="380" stroke="#e8e8e8" stroke-width=".8"/><line x1="70" x2="700" y1="380" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="80" x2="80" y1="390" y2="70" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><text x="80" y="398" fill="#555" font-size="9" text-anchor="middle">0</text><text x="200" y="398" fill="#555" font-size="9" text-anchor="middle">6</text><text x="320" y="398" fill="#555" font-size="9" text-anchor="middle">12</text><text x="440" y="398" fill="#555" font-size="9" text-anchor="middle">18</text><text x="560" y="398" fill="#555" font-size="9" text-anchor="middle">24</text><text x="680" y="398" fill="#555" font-size="9" text-anchor="middle">30</text><text x="380" y="415" fill="#333" font-size="10" font-weight="700" text-anchor="middle">Months</text><text x="72" y="384" fill="#555" font-size="9" text-anchor="end">$0</text><text x="72" y="324" fill="#555" font-size="9" text-anchor="end">$20M</text><text x="72" y="264" fill="#555" font-size="9" text-anchor="end">$40M</text><text x="72" y="204" fill="#555" font-size="9" text-anchor="end">$60M</text><text x="72" y="144" fill="#555" font-size="9" text-anchor="end">$80M</text><text x="72" y="84" fill="#555" font-size="9" text-anchor="end">$100M</text><text x="25" y="230" fill="#333" font-size="10" font-weight="700" text-anchor="middle" transform="rotate(-90 25 230)">Cumulative Cost ($M)</text><polygon fill="#fdebd0" fill-opacity=".3" points="80 380 680 170 680 380"/><line x1="80" x2="680" y1="380" y2="170" stroke="#c87b2a" stroke-width="3"/><polygon fill="#cfe2f3" fill-opacity=".25" points="80 380 80 204 680 192.5 680 380"/><polyline fill="none" stroke="#4a90c4" stroke-width="3" points="80 380 80 204 680 192.5"/><rect width="200" height="60" x="90" y="100" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/><text x="190" y="114" fill="#333" font-size="8.5" font-weight="700" text-anchor="middle">Break-even requires:</text><text x="190" y="128" fill="#555" font-size="8.5" text-anchor="middle">≈60% sustained utilization</text><text x="190" y="142" fill="#555" font-size="8.5" text-anchor="middle">At 20% util → cloud always wins</text><text x="190" y="154" fill="#555" font-size="8.5" text-anchor="middle">At 80%+ util → on-prem wins ~yr 2</text><rect width="145" height="24" x="310" y="100" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="382.5" y="116" fill="#4a90c4" font-size="10" font-weight="700" text-anchor="middle">On-Premises</text><rect width="145" height="24" x="310" y="130" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/><text x="382.5" y="146" fill="#c87b2a" font-size="10" font-weight="700" text-anchor="middle">Cloud (On-Demand)</text><rect width="100" height="35" x="561.4" y="100" fill="#a31f34"/><text x="611.4" y="115" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">Break-Even</text><text x="611.4" y="128" fill="#fff" font-size="9" text-anchor="middle">~Month 27</text><line x1="611.4" x2="611.4" y1="135" y2="193.7" stroke="#a31f34" stroke-width="1.5"/><circle cx="611.4" cy="193.7" r="5" fill="#a31f34" stroke="#fff" stroke-width="1.5"/><line x1="611.4" x2="611.4" y1="193.7" y2="380" stroke="#a31f34" stroke-dasharray="4 2" stroke-width="1.5"/><text x="611.4" y="375" fill="#a31f34" font-size="8.5" font-weight="700" text-anchor="middle">~27</text><text x="600" y="192" fill="#4a90c4" font-size="9.5" font-weight="700" text-anchor="middle" transform="rotate(-1 600 192)">On-Premises</text><text x="320" y="199" fill="#4a90c4" font-size="8">+$0.125M/mo OpEx</text><text x="600" y="205" fill="#c87b2a" font-size="9.5" font-weight="700" text-anchor="middle" transform="rotate(-19.3 600 205)">Cloud (On-Demand)</text><text x="180" y="355" fill="#c87b2a" font-size="8.5" font-weight="700">$2.3M / month</text><text x="180" y="367" fill="#555" font-size="8">(no upfront cost)</text><text x="340" y="350" fill="#c87b2a" font-size="8" opacity=".6">~$2.3M/month</text><text x="340" y="361" fill="#c87b2a" font-size="8" opacity=".6">$4/GPU-hr × 1,000 GPUs</text><text x="340" y="372" fill="#c87b2a" font-size="8" opacity=".6">× 80% utilization</text><text x="90" y="215" fill="#4a90c4" font-size="8">CapEx: ~$58.8M</text><text x="90" y="226" fill="#4a90c4" font-size="8">(hardware + network/facility)</text><text x="90" y="260" fill="#4a90c4" font-size="8" opacity=".6">CapEx: ~$58.8M</text><text x="90" y="271" fill="#4a90c4" font-size="8" opacity=".6">hardware + network/facility</text><text x="380" y="445" fill="#999" font-size="9" font-style="italic" text-anchor="middle">On-premises infrastructure requires ~27 months at 80% utilization to break even versus cloud. Below ~60% utilization, cloud pricing dominates across the full lifecycle.</text></svg>