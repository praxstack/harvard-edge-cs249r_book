<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 740 460"><rect width="740" height="460" fill="#fff"/><defs><marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#555" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arrow-orange" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#c87b2a" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arrow-blue" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#4a90c4" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arrow-green" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#3d9e5a" d="M0,0 L8,3 L0,6 Z"/></marker></defs><text x="370" y="20" fill="#333" font-size="12" font-weight="700" text-anchor="middle">Feature Store Architecture: Dual-Store Pattern</text><rect width="240" height="50" x="250" y="40" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/><text x="370" y="55" fill="#c87b2a" font-size="10" font-weight="700" text-anchor="middle">Feature Definitions</text><text x="370" y="68" fill="#c87b2a" font-size="8" text-anchor="middle">Single source of truth</text><text x="370" y="80" fill="#999" font-size="7.5" text-anchor="middle">schema · transformation logic · freshness SLOs</text><rect width="220" height="170" x="50" y="130" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="160" y="150" fill="#4a90c4" font-size="11" font-weight="700" text-anchor="middle">Offline Store</text><text x="160" y="165" fill="#4a90c4" font-size="8.5" text-anchor="middle">Batch · High-throughput · Historical</text><rect width="160" height="86" x="80" y="180" fill="#cfe2f3" stroke="#4a90c4" stroke-width=".8"/><text x="160" y="198" fill="#333" font-size="8" font-weight="700" text-anchor="middle">Storage:</text><text x="160" y="210" fill="#555" font-size="8" text-anchor="middle">BigQuery / Snowflake</text><text x="160" y="222" fill="#555" font-size="8" text-anchor="middle">Apache Iceberg / S3</text><text x="160" y="234" fill="#555" font-size="8" text-anchor="middle">Petabyte-scale</text><text x="160" y="246" fill="#999" font-size="7.5" text-anchor="middle">Throughput: GB/s reads</text><text x="160" y="258" fill="#999" font-size="7.5" text-anchor="middle">Latency: seconds–minutes</text><rect width="120" height="100" x="310" y="150" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/><text x="370" y="170" fill="#c87b2a" font-size="10" font-weight="700" text-anchor="middle">Materialization</text><text x="370" y="182" fill="#c87b2a" font-size="8.5" text-anchor="middle">Pipeline</text><text x="370" y="200" fill="#555" font-size="7.5" text-anchor="middle">Batch: Spark daily/hourly</text><text x="370" y="212" fill="#555" font-size="7.5" text-anchor="middle">Stream: Flink / Kafka</text><text x="370" y="224" fill="#555" font-size="7.5" text-anchor="middle">On-demand: request-time</text><text x="370" y="236" fill="#999" font-size="7.5" text-anchor="middle">enforces train equals serve</text><rect width="220" height="170" x="470" y="130" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/><text x="580" y="150" fill="#3d9e5a" font-size="11" font-weight="700" text-anchor="middle">Online Store</text><text x="580" y="165" fill="#3d9e5a" font-size="8.5" text-anchor="middle">Real-time · Low-latency · Point-lookup</text><rect width="160" height="86" x="500" y="180" fill="#d4edda" stroke="#3d9e5a" stroke-width=".8"/><text x="580" y="198" fill="#333" font-size="8" font-weight="700" text-anchor="middle">Storage:</text><text x="580" y="210" fill="#555" font-size="8" text-anchor="middle">Redis / DynamoDB</text><text x="580" y="222" fill="#555" font-size="8" text-anchor="middle">Bigtable / Cassandra</text><text x="580" y="234" fill="#555" font-size="8" text-anchor="middle">Key-value paradigm</text><text x="580" y="246" fill="#999" font-size="7.5" text-anchor="middle">Throughput: M queries/s</text><text x="580" y="258" fill="#999" font-size="7.5" text-anchor="middle">Latency: &lt; 10 ms p99</text><path fill="none" stroke="#c87b2a" stroke-dasharray="5 3" stroke-width="1.3" marker-end="url(#arrow-orange)" d="M 300,90 L 300,110 L 160,110 L 160,130"/><path fill="none" stroke="#c87b2a" stroke-dasharray="5 3" stroke-width="1.3" marker-end="url(#arrow-orange)" d="M 440,90 L 440,110 L 580,110 L 580,130"/><line x1="370" x2="370" y1="90" y2="150" stroke="#c87b2a" stroke-dasharray="5 3" stroke-width="1.3" marker-end="url(#arrow-orange)"/><line x1="270" x2="310" y1="200" y2="200" stroke="#4a90c4" stroke-width="1.5" marker-end="url(#arrow-blue)"/><line x1="430" x2="470" y1="200" y2="200" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arrow-green)"/><text x="290" y="186" fill="#4a90c4" font-size="7.5" font-weight="600" text-anchor="middle">batch</text><text x="290" y="195" fill="#4a90c4" font-size="7.5" text-anchor="middle">read</text><text x="450" y="186" fill="#3d9e5a" font-size="7.5" font-weight="600" text-anchor="middle">materialize</text><text x="450" y="195" fill="#3d9e5a" font-size="7.5" text-anchor="middle">write</text><rect width="220" height="50" x="50" y="330" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/><text x="160" y="348" fill="#333" font-size="10" font-weight="700" text-anchor="middle">Training Pipeline</text><text x="160" y="360" fill="#555" font-size="8" text-anchor="middle">High-throughput scan · hours</text><text x="160" y="372" fill="#999" font-size="7.5" text-anchor="middle">point-in-time joins for label generation</text><line x1="160" x2="160" y1="300" y2="330" stroke="#4a90c4" stroke-width="1.4" marker-end="url(#arrow-blue)"/><text x="150" y="313" fill="#4a90c4" font-size="7.5" font-weight="600" text-anchor="end">training</text><text x="150" y="323" fill="#4a90c4" font-size="7.5" text-anchor="end">features</text><rect width="220" height="50" x="470" y="330" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/><text x="580" y="348" fill="#333" font-size="10" font-weight="700" text-anchor="middle">Serving Pipeline</text><text x="580" y="360" fill="#555" font-size="8" text-anchor="middle">Point-lookup · &lt; 10 ms</text><text x="580" y="372" fill="#999" font-size="7.5" text-anchor="middle">inference request → feature fetch → prediction</text><line x1="580" x2="580" y1="300" y2="330" stroke="#3d9e5a" stroke-width="1.4" marker-end="url(#arrow-green)"/><text x="590" y="313" fill="#3d9e5a" font-size="7.5" font-weight="600" text-anchor="start">serving</text><text x="590" y="323" fill="#3d9e5a" font-size="7.5" text-anchor="start">features</text><rect width="160" height="30" x="290" y="340" fill="#fff" stroke="#a31f34" stroke-width="1.2"/><text x="370" y="354" fill="#a31f34" font-size="8.5" font-weight="700" text-anchor="middle">Architectural invariant:</text><text x="370" y="366" fill="#333" font-size="9" font-style="italic" text-anchor="middle">training feature = serving feature</text><rect width="640" height="40" x="50" y="400" fill="#fff" stroke="#a31f34" stroke-width="1"/><text x="370" y="418" fill="#a31f34" font-size="9" font-weight="700" text-anchor="middle">No single database satisfies both training (GB/s throughput) and serving (&lt; 10 ms p99) access patterns</text><text x="370" y="430" fill="#555" font-size="8.5" text-anchor="middle">Dual-store architecture makes training-serving skew an impossibility by construction, not a validation burden</text><text x="370" y="455" fill="#999" font-size="9" font-style="italic" text-anchor="middle">Materialization pipeline enforces point-in-time correctness: training features cannot embed future information.</text></svg>