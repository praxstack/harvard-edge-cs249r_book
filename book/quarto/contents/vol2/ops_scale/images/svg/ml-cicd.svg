80" y="344" fill="#999" font-size="7.5" text-anchor="middle">data quality</text><line x1="580" x2="131.2" y1="325" y2="325" stroke="#4a90c4" stroke-width="1.2" marker-end="url(#feedback-arr)"/><polyline fill="none" stroke="#4a90c4" stroke-dasharray="4 3" stroke-width="1.2" marker-end="url(#feedback-arr)" points="80 302 80 160 295 160 295 119.2"/><text x="187.5" y="154" fill="#4a90c4" font-size="7.5" font-weight="600" text-anchor="middle">drift triggers retrain</text><rect width="520" height="36" x="100" y="408" fill="#fff" stroke="#a31f34" stroke-width="1.2"/><text x="360" y="424" fill="#a31f34" font-size="9" font-weight="600" text-anchor="middle">ML pipelines differ from software CI/CD: data validation + model evaluation gates are mandatory</text><text x="360" y="436" fill="#555" font-size="8.5" text-anchor="middle">Monitoring closes the loop: production drift triggers the next training cycle automatically</text></svg>