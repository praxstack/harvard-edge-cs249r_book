<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 680 460"><rect width="680" height="460" fill="#fff"/><defs><marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#555" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arrow-red" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#a31f34" d="M0,0 L8,3 L0,6 Z"/></marker></defs><text x="340" y="28" fill="#333" font-size="13" font-weight="700" text-anchor="middle">Hierarchical Monitoring Pyramid</text><polygon fill="#f9d6d5" stroke="#c44" stroke-width="1.5" points="275 46 405 46 435 106 245 106"/><polygon fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5" points="245 110 435 110 475 180 205 180"/><polygon fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5" points="205 184 475 184 525 264 155 264"/><polygon fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5" points="155 268 525 268 580 358 100 358"/><text x="340" y="74" fill="#c44" font-size="10" font-weight="700" text-anchor="middle">SLA / Alerts</text><text x="340" y="88" fill="#c44" font-size="8" text-anchor="middle">P99 latency · error budget burn</text><text x="340" y="138" fill="#c87b2a" font-size="10" font-weight="700" text-anchor="middle">Business Metrics</text><text x="340" y="152" fill="#c87b2a" font-size="8" text-anchor="middle">Revenue impact · engagement lift · conversion rate</text><text x="340" y="166" fill="#c87b2a" font-size="8" text-anchor="middle">Alert: Executives / Product Owners</text><text x="340" y="214" fill="#3d9e5a" font-size="10" font-weight="700" text-anchor="middle">Model Metrics</text><text x="340" y="228" fill="#3d9e5a" font-size="8" text-anchor="middle">Accuracy · AUC · PSI drift · prediction latency p99</text><text x="340" y="242" fill="#3d9e5a" font-size="8" text-anchor="middle">Alert: Model Owners</text><text x="340" y="298" fill="#4a90c4" font-size="10" font-weight="700" text-anchor="middle">Infrastructure Metrics</text><text x="340" y="313" fill="#4a90c4" font-size="8" text-anchor="middle">GPU utilization · memory pressure · network throughput</text><text x="340" y="327" fill="#4a90c4" font-size="8" text-anchor="middle">CPU load · disk I/O · request queue depth</text><text x="340" y="341" fill="#4a90c4" font-size="8" text-anchor="middle">Alert: Platform Team</text><line x1="68" x2="68" y1="358" y2="46" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/><text x="54" y="205" fill="#999" font-size="9" font-weight="600" text-anchor="middle" transform="rotate(-90, 54, 205)">Alert Scope (broad → narrow)</text><line x1="436" x2="480" y1="76" y2="76" stroke="#a31f34" stroke-dasharray="3 2" stroke-width="1"/><rect width="90" height="22" x="482" y="65" fill="#a31f34"/><text x="527" y="80" fill="#fff" font-size="8" font-weight="700" text-anchor="middle">Exec / SRE</text><line x1="476" x2="510" y1="144" y2="144" stroke="#c87b2a" stroke-dasharray="3 2" stroke-width="1"/><rect width="110" height="22" x="512" y="133" fill="#fdebd0" stroke="#c87b2a" stroke-width=".8"/><text x="567" y="148" fill="#c87b2a" font-size="8" font-weight="700" text-anchor="middle">Product Owners</text><line x1="526" x2="550" y1="224" y2="224" stroke="#3d9e5a" stroke-dasharray="3 2" stroke-width="1"/><rect width="96" height="22" x="552" y="213" fill="#d4edda" stroke="#3d9e5a" stroke-width=".8"/><text x="600" y="228" fill="#3d9e5a" font-size="8" font-weight="700" text-anchor="middle">Model Owners</text><line x1="581" x2="598" y1="312" y2="312" stroke="#4a90c4" stroke-dasharray="3 2" stroke-width="1"/><rect width="60" height="22" x="600" y="301" fill="#cfe2f3" stroke="#4a90c4" stroke-width=".8"/><text x="630" y="316" fill="#4a90c4" font-size="8" font-weight="700" text-anchor="middle">Infra Team</text><text x="340" y="382" fill="#555" font-size="8.5" font-weight="600" text-anchor="middle">Signal aggregation: Infrastructure alerts roll up into Model, then Portfolio, then Business metrics</text><rect width="620" height="38" x="30" y="394" fill="#fff" stroke="#a31f34" stroke-width="1"/><text x="340" y="410" fill="#a31f34" font-size="9" font-weight="700" text-anchor="middle">100 models × 10 metrics × 3σ threshold = ~3 spurious alerts/evaluation without aggregation</text><text x="340" y="423" fill="#555" font-size="8.5" text-anchor="middle">Alert fatigue eliminated by routing low-level signals through portfolio aggregation before escalation</text><text x="340" y="450" fill="#999" font-size="9" font-style="italic" text-anchor="middle">Pyramid layers correspond to the four-level hierarchy described in Section 12.4.2.</text></svg>