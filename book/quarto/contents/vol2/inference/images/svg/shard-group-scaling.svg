 y="320" fill="#e8f5e9" stroke="#3d9e5a" stroke-width="1"/><text x="546" y="335" fill="#2d7a2d" font-size="8.5" font-weight="600" text-anchor="middle">8 GPUs · tensor parallel</text><text x="546" y="350" fill="#555" font-size="8" text-anchor="middle">one logical inference server</text><rect width="640" height="48" x="20" y="378" fill="#d4edda" stroke="#3d9e5a" stroke-width="1"/><text x="340" y="398" fill="#2d7a2d" font-size="9.5" font-weight="700" text-anchor="middle">LB treats each shard group as a single logical server.</text><text x="340" y="416" fill="#555" font-size="9" text-anchor="middle">Throughput scales linearly with shard groups; each group&apos;s internal AllReduce stays local.</text><text x="340" y="445" fill="#999" font-size="9" font-style="italic" text-anchor="middle">Horizontal scaling (more shard groups) increases throughput; vertical scaling (more GPUs per group) reduces per-request latency.</text></svg>