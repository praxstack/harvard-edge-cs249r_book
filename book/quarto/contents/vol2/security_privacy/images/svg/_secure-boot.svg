<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 680 460"><defs><marker id="arr-boot" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#4a90c4" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arr-fail" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#a31f34" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arr-chk" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#3d9e5a" d="M0,0 L8,3 L0,6 Z"/></marker></defs><rect width="680" height="460" fill="#fff"/><rect width="180" height="34" x="60" y="24" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="150" y="46" fill="#4a90c4" font-size="12" font-weight="700" text-anchor="middle">Boot Sequence</text><rect width="220" height="34" x="380" y="24" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/><text x="490" y="46" fill="#3d9e5a" font-size="12" font-weight="700" text-anchor="middle">Verification Step</text><rect width="180" height="50" x="60" y="80" fill="#e8e8e8" stroke="#999" stroke-width="1.5"/><text x="150" y="102" fill="#333" font-size="12" font-weight="700" text-anchor="middle">ROM</text><text x="150" y="118" fill="#555" font-size="9" text-anchor="middle">Immutable boot code (on-chip)</text><rect width="220" height="50" x="380" y="80" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.2"/><text x="490" y="102" fill="#3d9e5a" font-size="10" font-weight="700" text-anchor="middle">Hash Verification</text><text x="490" y="118" fill="#555" font-size="8.5" text-anchor="middle">SHA-256 of bootloader against ROM golden hash</text><text x="350" y="100" fill="#3d9e5a" font-size="12" text-anchor="middle">✓</text><line x1="242" x2="378" y1="105" y2="105" stroke="#3d9e5a" stroke-width="1.3" marker-end="url(#arr-chk)"/><line x1="150" x2="150" y1="130" y2="156" stroke="#4a90c4" stroke-width="1.5" marker-end="url(#arr-boot)"/><rect width="180" height="50" x="60" y="158" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="150" y="180" fill="#4a90c4" font-size="12" font-weight="700" text-anchor="middle">Bootloader</text><text x="150" y="196" fill="#555" font-size="9" text-anchor="middle">First stage boot manager</text><rect width="220" height="50" x="380" y="158" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.2"/><text x="490" y="180" fill="#3d9e5a" font-size="10" font-weight="700" text-anchor="middle">Signature Check</text><text x="490" y="196" fill="#555" font-size="8.5" text-anchor="middle">RSA/ECDSA signature vs. embedded public key</text><text x="350" y="178" fill="#3d9e5a" font-size="12" text-anchor="middle">✓</text><line x1="242" x2="378" y1="183" y2="183" stroke="#3d9e5a" stroke-width="1.3" marker-end="url(#arr-chk)"/><line x1="150" x2="150" y1="208" y2="234" stroke="#4a90c4" stroke-width="1.5" marker-end="url(#arr-boot)"/><rect width="180" height="50" x="60" y="236" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="150" y="258" fill="#4a90c4" font-size="12" font-weight="700" text-anchor="middle">Kernel</text><text x="150" y="274" fill="#555" font-size="9" text-anchor="middle">OS kernel image + initramfs</text><rect width="220" height="50" x="380" y="236" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.2"/><text x="490" y="258" fill="#3d9e5a" font-size="10" font-weight="700" text-anchor="middle">Certificate Validation</text><text x="490" y="274" fill="#555" font-size="8.5" text-anchor="middle">X.509 chain of trust to root CA in ROM</text><text x="350" y="256" fill="#3d9e5a" font-size="12" text-anchor="middle">✓</text><line x1="242" x2="378" y1="261" y2="261" stroke="#3d9e5a" stroke-width="1.3" marker-end="url(#arr-chk)"/><line x1="150" x2="150" y1="286" y2="312" stroke="#4a90c4" stroke-width="1.5" marker-end="url(#arr-boot)"/><rect width="180" height="50" x="60" y="314" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="150" y="336" fill="#4a90c4" font-size="12" font-weight="700" text-anchor="middle">OS</text><text x="150" y="352" fill="#555" font-size="9" text-anchor="middle">Operating system + drivers</text><rect width="220" height="50" x="380" y="314" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.2"/><text x="490" y="336" fill="#3d9e5a" font-size="10" font-weight="700" text-anchor="middle">Integrity Measurement</text><text x="490" y="352" fill="#555" font-size="8.5" text-anchor="middle">TPM PCR extend: cumulative boot log</text><text x="350" y="334" fill="#3d9e5a" font-size="12" text-anchor="middle">✓</text><line x1="242" x2="378" y1="339" y2="339" stroke="#3d9e5a" stroke-width="1.3" marker-end="url(#arr-chk)"/><line x1="150" x2="150" y1="364" y2="390" stroke="#4a90c4" stroke-width="1.5" marker-end="url(#arr-boot)"/><rect width="180" height="44" x="60" y="392" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="150" y="412" fill="#4a90c4" font-size="12" font-weight="700" text-anchor="middle">Application</text><text x="150" y="428" fill="#555" font-size="9" text-anchor="middle">ML inference binary / runtime</text><rect width="220" height="44" x="380" y="392" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.2"/><text x="490" y="412" fill="#3d9e5a" font-size="10" font-weight="700" text-anchor="middle">Boot Attestation Complete</text><text x="490" y="428" fill="#555" font-size="8.5" text-anchor="middle">Remote verifier receives signed boot log</text><text x="350" y="410" fill="#3d9e5a" font-size="12" text-anchor="middle">✓</text><line x1="242" x2="378" y1="414" y2="414" stroke="#3d9e5a" stroke-width="1.3" marker-end="url(#arr-chk)"/><rect width="30" height="24" x="380" y="246" fill="#f9d6d5" stroke="#a31f34" stroke-width="1" opacity="0"/><rect width="48" height="34" x="616" y="248" fill="#f9d6d5" stroke="#a31f34" stroke-width="1.5"/><text x="640" y="263" fill="#a31f34" font-size="9" font-weight="700" text-anchor="middle">FAIL</text><text x="640" y="275" fill="#a31f34" font-size="8" text-anchor="middle">✗</text><line x1="600" x2="614" y1="261" y2="261" stroke="#a31f34" stroke-width="1.3" marker-end="url(#arr-fail)"/><rect width="48" height="36" x="616" y="298" fill="#a31f34" stroke="#c44" stroke-width="1.5"/><text x="640" y="316" fill="#fff" font-size="8.5" font-weight="700" text-anchor="middle">Boot</text><text x="640" y="328" fill="#fff" font-size="8.5" font-weight="700" text-anchor="middle">Halted</text><line x1="640" x2="640" y1="282" y2="296" stroke="#a31f34" stroke-width="1.3" marker-end="url(#arr-fail)"/><text x="60" y="450" fill="#3d9e5a" font-size="9">✓ = Verification passed</text><text x="200" y="450" fill="#a31f34" font-size="9">✗ = Verification failed → chain stops</text><text x="430" y="450" fill="#555" font-size="9" font-style="italic">All steps use hardware root-of-trust anchored in ROM</text></svg>