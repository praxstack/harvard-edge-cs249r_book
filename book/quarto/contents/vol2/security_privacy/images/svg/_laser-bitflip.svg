<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 680 460"><defs><marker id="arr-laser" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#a31f34" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arr-flow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#4a90c4" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arr-hijack" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#a31f34" d="M0,0 L8,3 L0,6 Z"/></marker></defs><rect width="680" height="460" fill="#fff"/><rect width="320" height="220" x="180" y="50" fill="#e8e8e8" stroke="#999" stroke-width="2"/><text x="340" y="73" fill="#555" font-size="10" font-weight="700" text-anchor="middle">Microcontroller Die (Top-Down View)</text><g fill="none" stroke="#bbb" stroke-width=".6"><line x1="200" x2="200" y1="90" y2="258"/><line x1="230" x2="230" y1="90" y2="258"/><line x1="260" x2="260" y1="90" y2="258"/><line x1="320" x2="320" y1="90" y2="258"/><line x1="380" x2="380" y1="90" y2="258"/><line x1="420" x2="420" y1="90" y2="258"/><line x1="460" x2="460" y1="90" y2="258"/><line x1="190" x2="490" y1="100" y2="100"/><line x1="190" x2="490" y1="130" y2="130"/><line x1="190" x2="490" y1="160" y2="160"/><line x1="190" x2="490" y1="190" y2="190"/><line x1="190" x2="490" y1="220" y2="220"/><line x1="190" x2="490" y1="250" y2="250"/></g><rect width="118" height="80" x="192" y="82" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1"/><text x="251" y="108" fill="#4a90c4" font-size="8.5" text-anchor="middle">CPU Core</text><rect width="158" height="80" x="322" y="82" fill="#e8e8e8" stroke="#999" stroke-width="1"/><text x="401" y="118" fill="#555" font-size="8.5" text-anchor="middle">SRAM / Code Memory</text><rect width="42" height="42" x="354" y="166" fill="#fdebd0" stroke="#c87b2a" stroke-width="2"/><text x="387" y="186" fill="#c87b2a" font-size="8" font-weight="700" text-anchor="middle">Target</text><text x="387" y="198" fill="#c87b2a" font-size="8" text-anchor="middle">cell</text><line x1="375" x2="375" y1="177" y2="177" stroke="#c87b2a" stroke-width="1.2"/><line x1="370" x2="380" y1="178" y2="178" stroke="#c87b2a" stroke-width="1.2"/><rect width="36" height="20" x="414" y="158" fill="#d4edda" stroke="#3d9e5a" stroke-width="1"/><text x="432" y="172" fill="#3d9e5a" font-size="11" font-weight="700" text-anchor="middle">1</text><line x1="452" x2="468" y1="168" y2="168" stroke="#a31f34" stroke-width="1.5" marker-end="url(#arr-laser)"/><rect width="36" height="20" x="470" y="158" fill="#f9d6d5" stroke="#a31f34" stroke-width="1.5"/><text x="488" y="172" fill="#a31f34" font-size="11" font-weight="700" text-anchor="middle">0</text><text x="432" y="152" fill="#3d9e5a" font-size="7.5" font-style="italic" text-anchor="middle">before</text><text x="488" y="152" fill="#a31f34" font-size="7.5" font-style="italic" text-anchor="middle">after</text><line x1="100" x2="360" y1="20" y2="172" stroke="#a31f34" stroke-width="1.5" marker-end="url(#arr-laser)" opacity=".85"/><line x1="100" x2="358" y1="20" y2="178" stroke="#f9d6d5" stroke-width="5" opacity=".35"/><rect width="120" height="36" x="18" y="10" fill="#f9d6d5" stroke="#a31f34" stroke-width="1.2"/><text x="78" y="27" fill="#a31f34" font-size="9.5" font-weight="700" text-anchor="middle">Focused Laser /</text><text x="78" y="41" fill="#a31f34" font-size="9.5" text-anchor="middle">EM Pulse Source</text><rect width="124" height="28" x="220" y="174" fill="#fdebd0" stroke="#c87b2a" stroke-width="1"/><text x="282" y="179" fill="#c87b2a" font-size="8.5" font-weight="700" text-anchor="middle">Fault injection at target cell</text><line x1="354" x2="342" y1="188" y2="188" stroke="#c87b2a" stroke-width="1" marker-end="url(#arr-flow)"/><text x="340" y="294" fill="#333" font-size="10" font-weight="700" text-anchor="middle">Instruction Execution: Before and After Fault</text><line x1="100" x2="580" y1="300" y2="300" stroke="#bbb" stroke-width="1"/><text x="80" y="325" fill="#3d9e5a" font-size="8.5" font-weight="600">Normal:</text><rect width="80" height="26" x="120" y="312" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1"/><text x="160" y="329" fill="#4a90c4" font-size="8.5" text-anchor="middle">authenticate()</text><line x1="200" x2="218" y1="325" y2="325" stroke="#4a90c4" stroke-width="1.3" marker-end="url(#arr-flow)"/><rect width="80" height="26" x="220" y="312" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1"/><text x="260" y="329" fill="#4a90c4" font-size="8.5" text-anchor="middle">check_sig()</text><line x1="300" x2="318" y1="325" y2="325" stroke="#4a90c4" stroke-width="1.3" marker-end="url(#arr-flow)"/><rect width="80" height="26" x="320" y="312" fill="#d4edda" stroke="#3d9e5a" stroke-width="1"/><text x="360" y="325" fill="#3d9e5a" font-size="8.5" text-anchor="middle">if (ok)</text><text x="360" y="335" fill="#3d9e5a" font-size="8.5" text-anchor="middle">grant_access()</text><line x1="400" x2="418" y1="325" y2="325" stroke="#4a90c4" stroke-width="1.3" marker-end="url(#arr-flow)"/><rect width="80" height="26" x="420" y="312" fill="#d4edda" stroke="#3d9e5a" stroke-width="1"/><text x="460" y="325" fill="#3d9e5a" font-size="8.5" text-anchor="middle">secure_exec()</text><text x="460" y="335" fill="#3d9e5a" font-size="8.5" text-anchor="middle">✓ trusted</text><text x="80" y="378" fill="#a31f34" font-size="8.5" font-weight="600">Faulted:</text><rect width="80" height="26" x="120" y="365" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1"/><text x="160" y="382" fill="#4a90c4" font-size="8.5" text-anchor="middle">authenticate()</text><line x1="200" x2="218" y1="378" y2="378" stroke="#a31f34" stroke-width="1.3" marker-end="url(#arr-hijack)"/><rect width="80" height="26" x="220" y="365" fill="#f9d6d5" stroke="#a31f34" stroke-width="1.3"/><text x="260" y="378" fill="#a31f34" font-size="8.5" text-anchor="middle">check_sig()</text><text x="260" y="388" fill="#a31f34" font-size="8" text-anchor="middle">⚠ BIT FLIP</text><line x1="300" x2="360" y1="378" y2="378" stroke="#a31f34" stroke-dasharray="4 3" stroke-width="1.5"/><line x1="360" x2="360" y1="378" y2="408" stroke="#a31f34" stroke-dasharray="4 3" stroke-width="1.5"/><line x1="360" x2="490" y1="408" y2="408" stroke="#a31f34" stroke-width="1.5" marker-end="url(#arr-hijack)"/><rect width="114" height="56" x="492" y="365" fill="#f9d6d5" stroke="#a31f34" stroke-width="2"/><text x="549" y="385" fill="#a31f34" font-size="9" font-weight="700" text-anchor="middle">Attacker Payload</text><text x="549" y="399" fill="#555" font-size="8" text-anchor="middle">Privilege escalation,</text><text x="549" y="411" fill="#555" font-size="8" text-anchor="middle">key extraction</text><text x="390" y="402" fill="#a31f34" font-size="8" font-style="italic">branch hijack</text><text x="340" y="450" fill="#999" font-size="9" font-style="italic" text-anchor="middle">A single-bit fault in a branch condition can bypass all cryptographic checks, redirecting execution to attacker-controlled code.</text></svg>