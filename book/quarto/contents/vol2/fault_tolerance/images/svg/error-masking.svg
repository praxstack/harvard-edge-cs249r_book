<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 680 490"><defs><marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#333" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arrow-green" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#3d9e5a" d="M0,0 L8,3 L0,6 Z"/></marker></defs><rect width="680" height="490" fill="#fff"/><text x="245" y="26" fill="#333" font-size="12" font-weight="700" text-anchor="middle">Triple Modular Redundancy (TMR)</text><rect width="80" height="40" x="20" y="105" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/><text x="60" y="128" fill="#4a90c4" font-size="10" font-weight="700" text-anchor="middle">Input X</text><path fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" d="M100,115 L120,115 L120,65 L140,65"/><path fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" d="M100,125 L140,125"/><path fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" d="M100,135 L120,135 L120,185 L140,185"/><rect width="110" height="50" x="140" y="40" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.2"/><text x="195" y="60" fill="#3d9e5a" font-size="10" font-weight="700" text-anchor="middle">Unit A</text><text x="195" y="76" fill="#555" font-size="9" text-anchor="middle">f(X) = 42</text><rect width="110" height="50" x="140" y="100" fill="#f9d6d5" stroke="#c44" stroke-width="1.8"/><text x="195" y="120" fill="#c44" font-size="10" font-weight="700" text-anchor="middle">Unit B</text><text x="195" y="136" fill="#c44" font-size="9" text-anchor="middle">f(X) = 99 (fault!)</text><rect width="110" height="50" x="140" y="160" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.2"/><text x="195" y="180" fill="#3d9e5a" font-size="10" font-weight="700" text-anchor="middle">Unit C</text><text x="195" y="196" fill="#555" font-size="9" text-anchor="middle">f(X) = 42</text><path fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" d="M250,65 L260,65 L260,115 L310,115"/><path fill="none" stroke="#c44" stroke-dasharray="4 3" stroke-width="1.2" marker-end="url(#arrow)" d="M250,125 L310,125"/><path fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" d="M250,185 L260,185 L260,135 L310,135"/><rect width="90" height="50" x="310" y="100" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/><text x="355" y="120" fill="#c87b2a" font-size="10" font-weight="700" text-anchor="middle">Voter</text><text x="355" y="136" fill="#555" font-size="9" font-weight="700" text-anchor="middle">2/3 majority</text><line x1="400" x2="432" y1="125" y2="125" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect width="90" height="40" x="432" y="105" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/><text x="477" y="122" fill="#3d9e5a" font-size="10" font-weight="700" text-anchor="middle">Output</text><text x="477" y="136" fill="#3d9e5a" font-size="10" font-weight="700" text-anchor="middle">= 42</text><rect width="212" height="40" x="310" y="40" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/><text x="416" y="56" fill="#a31f34" font-size="9" font-weight="700" text-anchor="middle">Single-fault correction</text><text x="416" y="70" fill="#555" font-size="9" text-anchor="middle">200% hardware overhead</text><rect width="130" height="32" x="268" y="160" fill="#fff" stroke="#c44" stroke-width="1"/><text x="333" y="174.5" fill="#c44" font-size="8" text-anchor="middle">Faulty value 99 is</text><text x="333" y="187.5" fill="#c44" font-size="8" text-anchor="middle">outvoted by correct 42</text><text x="340" y="240" fill="#333" font-size="12" font-weight="700" text-anchor="middle">ECC Memory Error Correction</text><rect width="620" height="180" x="30" y="255" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/><text x="89" y="280" fill="#333" font-size="9.5" font-weight="700" text-anchor="middle">Data Bits</text><g fill="#cfe2f3" stroke="#4a90c4" stroke-width="1"><rect width="22" height="22" x="42" y="288"/><rect width="22" height="22" x="66" y="288"/><rect width="22" height="22" x="90" y="288"/><rect width="22" height="22" x="114" y="288"/></g><g fill="#4a90c4" font-size="9" font-weight="700" text-anchor="middle"><text x="53" y="303">1</text><text x="77" y="303">0</text><text x="101" y="303">1</text><text x="125" y="303">1</text></g><text x="185" y="280" fill="#333" font-size="9.5" font-weight="700" text-anchor="middle">Parity</text><g fill="#fdebd0" stroke="#c87b2a" stroke-width="1"><rect width="22" height="22" x="150" y="288"/><rect width="22" height="22" x="174" y="288"/><rect width="22" height="22" x="198" y="288"/></g><g fill="#c87b2a" font-size="9" font-weight="700" text-anchor="middle"><text x="161" y="303">P1</text><text x="185" y="303">P2</text><text x="209" y="303">P3</text></g><line x1="220" x2="260" y1="299" y2="299" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/><text x="240" y="290" fill="#555" font-size="8" text-anchor="middle">store</text><text x="343" y="280" fill="#333" font-size="9.5" font-weight="700" text-anchor="middle">Stored (with bit error)</text><g fill="#cfe2f3" stroke="#4a90c4" stroke-width="1"><rect width="22" height="22" x="260" y="288"/><rect width="22" height="22" x="308" y="288"/><rect width="22" height="22" x="332" y="288"/></g><rect width="22" height="22" x="284" y="288" fill="#f9d6d5" stroke="#c44" stroke-width="1.5"/><g font-size="9" font-weight="700" text-anchor="middle"><text x="271" y="303" fill="#4a90c4">1</text><text x="295" y="303" fill="#c44">1</text><text x="319" y="303" fill="#4a90c4">1</text><text x="343" y="303" fill="#4a90c4">1</text></g><g fill="#fdebd0" stroke="#c87b2a" stroke-width="1"><rect width="22" height="22" x="356" y="288"/><rect width="22" height="22" x="380" y="288"/><rect width="22" height="22" x="404" y="288"/></g><g fill="#c87b2a" font-size="9" font-weight="700" text-anchor="middle"><text x="367" y="303">P1</text><text x="391" y="303">P2</text><text x="415" y="303">P3</text></g><line x1="295" x2="295" y1="310" y2="330" stroke="#c44" stroke-width="1.2"/><text x="295" y="340.5" fill="#c44" font-size="8" font-weight="700" text-anchor="middle">Bit flip!</text><text x="295" y="353.5" fill="#c44" font-size="8" text-anchor="middle">0 → 1</text><line x1="426" x2="458" y1="299" y2="299" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/><text x="442" y="290" fill="#555" font-size="8" text-anchor="middle">read</text><rect width="85" height="40" x="458" y="280" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.2"/><text x="500.5" y="296" fill="#c87b2a" font-size="9" font-weight="700" text-anchor="middle">Syndrome</text><text x="500.5" y="310" fill="#c87b2a" font-size="9" font-weight="700" text-anchor="middle">Calculator</text><line x1="543" x2="552" y1="299" y2="299" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arrow-green)"/><text x="599" y="280" fill="#3d9e5a" font-size="9.5" font-weight="700" text-anchor="middle">Corrected</text><g fill="#d4edda" stroke="#3d9e5a" stroke-width="1.2"><rect width="22" height="22" x="552" y="288"/><rect width="22" height="22" x="576" y="288"/><rect width="22" height="22" x="600" y="288"/><rect width="22" height="22" x="624" y="288"/></g><g fill="#3d9e5a" font-size="9" font-weight="700" text-anchor="middle"><text x="563" y="303">1</text><text x="587" y="303">0</text><text x="611" y="303">1</text><text x="635" y="303">1</text></g><rect width="90" height="28" x="455" y="330" fill="#fff" stroke="#3d9e5a" stroke-width="1"/><text x="500" y="342.5" fill="#3d9e5a" font-size="8" font-weight="700" text-anchor="middle">Syndrome = 010</text><text x="500" y="355.5" fill="#555" font-size="8" text-anchor="middle">Locates bit 2 error</text><rect width="420" height="30" x="130" y="370" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/><text x="340" y="384.5" fill="#555" font-size="9" text-anchor="middle">SECDED (Single Error Correct, Double Error Detect): corrects 1-bit errors, detects 2-bit errors</text><text x="340" y="399.5" fill="#555" font-size="9" text-anchor="middle">Standard in all datacenter GPU HBM memory (e.g., A100, H100)</text><g transform="translate(50, 445)"><rect width="14" height="10" x="0" y="0" fill="#d4edda" stroke="#3d9e5a" stroke-width="1"/><text x="20" y="9" fill="#555" font-size="9">Correct</text><rect width="14" height="10" x="85" y="0" fill="#f9d6d5" stroke="#c44" stroke-width="1"/><text x="105" y="9" fill="#555" font-size="9">Corrupted</text><rect width="14" height="10" x="175" y="0" fill="#fdebd0" stroke="#c87b2a" stroke-width="1"/><text x="195" y="9" fill="#555" font-size="9">Parity / Voter</text><rect width="14" height="10" x="275" y="0" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1"/><text x="295" y="9" fill="#555" font-size="9">Data input</text></g><text x="340" y="458" fill="#999" font-size="9" font-style="italic" text-anchor="middle">Error masking: TMR voting (top) and ECC memory correction (bottom)</text></svg>