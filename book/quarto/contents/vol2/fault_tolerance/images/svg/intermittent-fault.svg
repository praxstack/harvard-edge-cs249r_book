<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 760 530"><defs><marker id="arrowRed" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#c44" d="M0,0 L8,3 L0,6 Z"/></marker></defs><rect width="760" height="530" fill="#fff"/><text x="170" y="30" fill="#3d9e5a" font-size="12" font-weight="700" text-anchor="middle">Normal State (ambient temperature)</text><text x="590" y="30" fill="#c44" font-size="12" font-weight="700" text-anchor="middle">Stressed State (thermal expansion)</text><line x1="380" x2="380" y1="20" y2="410" stroke="#bbb" stroke-dasharray="6 4" stroke-width="1.5"/><rect width="200" height="80" x="70" y="60" fill="#cfe2f3" stroke="#4a90c4" stroke-width="2"/><text x="170" y="90" fill="#4a90c4" font-size="12" font-weight="700" text-anchor="middle">IC Die</text><text x="170" y="106" fill="#4a90c4" font-size="9" text-anchor="middle">SoC / GPU processor</text><text x="170" y="120" fill="#4a90c4" font-size="9" text-anchor="middle">28°C ambient</text><rect width="200" height="30" x="70" y="140" fill="#fdebd0" fill-opacity=".5" stroke="#c87b2a" stroke-dasharray="4 2" stroke-width="1.2"/><text x="170" y="134" fill="#c87b2a" font-size="9" text-anchor="middle">underfill epoxy</text><ellipse cx="110" cy="170" fill="#e8e8e8" stroke="#999" stroke-width="1.2" rx="16" ry="6"/><rect width="32" height="30" x="94" y="140" fill="#bbb" stroke="#999" stroke-width="1"/><ellipse cx="110" cy="140" fill="#bbb" stroke="#999" stroke-width="1.2" rx="16" ry="6"/><text x="110" y="184" fill="#999" font-size="9" text-anchor="middle">bump</text><ellipse cx="170" cy="170" fill="#e8e8e8" stroke="#999" stroke-width="1.2" rx="16" ry="6"/><rect width="32" height="30" x="154" y="140" fill="#bbb" stroke="#999" stroke-width="1"/><ellipse cx="170" cy="140" fill="#bbb" stroke="#999" stroke-width="1.2" rx="16" ry="6"/><text x="170" y="184" fill="#999" font-size="9" text-anchor="middle">bump</text><ellipse cx="230" cy="170" fill="#e8e8e8" stroke="#999" stroke-width="1.2" rx="16" ry="6"/><rect width="32" height="30" x="214" y="140" fill="#bbb" stroke="#999" stroke-width="1"/><ellipse cx="230" cy="140" fill="#bbb" stroke="#999" stroke-width="1.2" rx="16" ry="6"/><text x="230" y="184" fill="#999" font-size="9" text-anchor="middle">bump</text><rect width="200" height="50" x="70" y="170" fill="#d4edda" stroke="#3d9e5a" stroke-width="2"/><text x="170" y="200" fill="#3d9e5a" font-size="11" font-weight="600" text-anchor="middle">Substrate (PCB)</text><text x="170" y="214" fill="#3d9e5a" font-size="9" text-anchor="middle">organic laminate</text><rect width="160" height="40" x="90" y="240" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/><text x="170" y="258" fill="#3d9e5a" font-size="10" font-weight="700" text-anchor="middle">Connection: INTACT</text><text x="170" y="272" fill="#3d9e5a" font-size="9" text-anchor="middle">Electrical continuity: 100%</text><rect width="200" height="90" x="70" y="300" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/><text x="170" y="320" fill="#555" font-size="10" font-weight="600" text-anchor="middle">Copper Bump (normal)</text><rect width="100" height="40" x="120" y="330" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1"/><text x="170" y="354" fill="#4a90c4" font-size="9" text-anchor="middle">Cu bump — full contact</text><rect width="100" height="10" x="120" y="370" fill="#d4edda" stroke="#3d9e5a" stroke-width="1"/><text x="170" y="378" fill="#3d9e5a" font-size="9" text-anchor="middle">substrate pad</text><rect width="200" height="80" x="490" y="60" fill="#f9d6d5" stroke="#c44" stroke-width="2"/><text x="590" y="90" fill="#c44" font-size="12" font-weight="700" text-anchor="middle">IC Die</text><text x="590" y="106" fill="#c44" font-size="9" text-anchor="middle">thermal stress</text><text x="590" y="120" fill="#c44" font-size="9" text-anchor="middle">95°C (GPU backward pass)</text><ellipse cx="530" cy="170" fill="#e8e8e8" stroke="#999" stroke-width="1.2" rx="16" ry="6"/><rect width="32" height="30" x="514" y="140" fill="#bbb" stroke="#999" stroke-width="1"/><ellipse cx="530" cy="140" fill="#bbb" stroke="#999" stroke-width="1.2" rx="16" ry="6"/><ellipse cx="590" cy="170" fill="#e8e8e8" stroke="#999" stroke-width="1.2" rx="16" ry="6"/><rect width="32" height="12" x="574" y="158" fill="#bbb" stroke="#999" stroke-width="1"/><line x1="570" x2="610" y1="156" y2="156" stroke="#c44" stroke-width="3"/><rect width="32" height="14" x="574" y="140" fill="#bbb" stroke="#999" stroke-width="1"/><ellipse cx="590" cy="140" fill="#bbb" stroke="#c44" stroke-width="2" rx="16" ry="6"/><path fill="none" stroke="#c44" stroke-width="1.2" marker-end="url(#arrowRed)" d="M 670 130 L 610 130 L 610 154"/><text x="675" y="129" fill="#c44" font-size="9" font-weight="700">← crack</text><text x="675" y="141" fill="#c44" font-size="9">(intermittent open)</text><ellipse cx="650" cy="170" fill="#e8e8e8" stroke="#999" stroke-width="1.2" rx="16" ry="6"/><rect width="32" height="30" x="634" y="140" fill="#bbb" stroke="#999" stroke-width="1"/><ellipse cx="650" cy="140" fill="#bbb" stroke="#999" stroke-width="1.2" rx="16" ry="6"/><rect width="200" height="50" x="490" y="170" fill="#d4edda" stroke="#3d9e5a" stroke-width="2"/><text x="590" y="200" fill="#3d9e5a" font-size="11" font-weight="600" text-anchor="middle">Substrate (PCB)</text><text x="590" y="214" fill="#3d9e5a" font-size="9" text-anchor="middle">organic laminate</text><rect width="160" height="40" x="510" y="240" fill="#f9d6d5" stroke="#c44" stroke-width="1.5"/><text x="590" y="258" fill="#c44" font-size="10" font-weight="700" text-anchor="middle">Connection: OPEN</text><text x="590" y="272" fill="#c44" font-size="9" text-anchor="middle">Electrical continuity: intermittent</text><rect width="200" height="90" x="490" y="300" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/><text x="590" y="320" fill="#c44" font-size="10" font-weight="600" text-anchor="middle">Solder Crack (fatigued)</text><rect width="100" height="10" x="540" y="330" fill="#f9d6d5" stroke="#c44" stroke-width="1"/><text x="590" y="338" fill="#c44" font-size="9" text-anchor="middle">Cu bump (separated)</text><text x="590" y="354" fill="#c44" font-size="9" text-anchor="middle">← hairline crack →</text><line x1="520" x2="660" y1="360" y2="360" stroke="#c44" stroke-width="2"/><rect width="100" height="10" x="540" y="370" fill="#d4edda" stroke="#3d9e5a" stroke-width="1"/><text x="590" y="378" fill="#3d9e5a" font-size="9" text-anchor="middle">substrate pad</text><rect width="600" height="90" x="80" y="420" fill="#fff" stroke="#bbb" stroke-width="1"/><text x="380" y="440" fill="#555" font-size="11" font-weight="700" text-anchor="middle">Intermittent Fault: Thermal Cycling Mechanism</text><polyline fill="none" stroke="#c87b2a" stroke-width="2" points="120 475 150 455 180 475 210 455 240 475 270 455 300 475"/><text x="120" y="485" fill="#999" font-size="9" text-anchor="middle">cold</text><text x="150" y="450" fill="#c44" font-size="9" text-anchor="middle">hot</text><text x="210" y="490" fill="#999" font-size="9" text-anchor="middle">repeated heating/cooling cycles</text><text x="210" y="502" fill="#999" font-size="9" text-anchor="middle">(GPU backward pass generates heat)</text><text x="450" y="455" fill="#555" font-size="9.5">Die (Si): CTE = 2.8 ppm/°C</text><text x="450" y="467" fill="#555" font-size="9.5">Substrate: CTE = 17 ppm/°C</text><text x="450" y="479" fill="#c44" font-size="9.5" font-weight="700">CTE mismatch → fatigue crack</text><text x="450" y="491" fill="#999" font-size="9">crack closes when cool → passes tests</text><text x="450" y="503" fill="#999" font-size="9">crack opens when hot → intermittent open</text></svg>