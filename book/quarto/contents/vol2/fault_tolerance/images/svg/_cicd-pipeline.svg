<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 680 460"><defs><marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#333" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arrow-green" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#3d9e5a" d="M0,0 L8,3 L0,6 Z"/></marker></defs><rect width="680" height="460" fill="#fff"/><rect width="310" height="80" x="20" y="30" fill="none" stroke="#4a90c4" stroke-dasharray="6 4" stroke-width="1.2"/><text x="175" y="22" fill="#4a90c4" font-size="10" font-weight="700" text-anchor="middle">Continuous Integration (CI)</text><rect width="310" height="80" x="350" y="30" fill="none" stroke="#3d9e5a" stroke-dasharray="6 4" stroke-width="1.2"/><text x="505" y="22" fill="#3d9e5a" font-size="10" font-weight="700" text-anchor="middle">Continuous Delivery (CD)</text><rect width="75" height="50" x="30" y="45" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/><text x="67.5" y="66" fill="#4a90c4" font-size="9" font-weight="700" text-anchor="middle">Code</text><text x="67.5" y="79" fill="#4a90c4" font-size="9" font-weight="700" text-anchor="middle">Commit</text><line x1="105" x2="120" y1="70" y2="70" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="75" height="50" x="122" y="45" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/><text x="159.5" y="66" fill="#4a90c4" font-size="9" font-weight="700" text-anchor="middle">Unit</text><text x="159.5" y="79" fill="#4a90c4" font-size="9" font-weight="700" text-anchor="middle">Tests</text><line x1="197" x2="212" y1="70" y2="70" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="75" height="50" x="214" y="45" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/><text x="251.5" y="66" fill="#4a90c4" font-size="9" font-weight="700" text-anchor="middle">Integration</text><text x="251.5" y="79" fill="#4a90c4" font-size="9" font-weight="700" text-anchor="middle">Tests</text><line x1="289" x2="360" y1="70" y2="70" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="80" height="50" x="362" y="45" fill="#f9d6d5" stroke="#c44" stroke-width="1.5"/><text x="402" y="66" fill="#c44" font-size="9" font-weight="700" text-anchor="middle">Chaos</text><text x="402" y="79" fill="#c44" font-size="9" font-weight="700" text-anchor="middle">Tests</text><line x1="442" x2="457" y1="70" y2="70" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="75" height="50" x="459" y="45" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.2"/><text x="496.5" y="66" fill="#c87b2a" font-size="9" font-weight="700" text-anchor="middle">Staging</text><text x="496.5" y="79" fill="#555" font-size="9" text-anchor="middle">Shadow</text><line x1="534" x2="549" y1="70" y2="70" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="50" height="50" x="551" y="45" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.2"/><text x="576" y="66" fill="#3d9e5a" font-size="9" font-weight="700" text-anchor="middle">Canary</text><text x="576" y="79" fill="#555" font-size="8" text-anchor="middle">1%</text><line x1="601" x2="611" y1="70" y2="70" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="47" height="50" x="613" y="45" fill="#3d9e5a" stroke="#3d9e5a" stroke-width="1.2"/><text x="636.5" y="66" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">Prod</text><text x="636.5" y="79" fill="#d4edda" font-size="8" text-anchor="middle">100%</text><rect width="620" height="170" x="30" y="130" fill="#fff" stroke="#c44" stroke-width="1.2"/><text x="340" y="152" fill="#c44" font-size="12" font-weight="700" text-anchor="middle">Chaos / Fault Injection Stage (Detail)</text><line x1="402" x2="402" y1="95" y2="128" stroke="#c44" stroke-dasharray="4 3" stroke-width="1.2"/><rect width="130" height="55" x="50" y="170" fill="#f9d6d5" stroke="#c44" stroke-width="1"/><text x="115" y="188" fill="#c44" font-size="9" font-weight="700" text-anchor="middle">Kill Random GPU</text><text x="115" y="203" fill="#555" font-size="8.5" text-anchor="middle">Simulate hardware death;</text><text x="115" y="215" fill="#555" font-size="8.5" text-anchor="middle">verify checkpoint recovery</text><rect width="130" height="55" x="195" y="170" fill="#f9d6d5" stroke="#c44" stroke-width="1"/><text x="260" y="188" fill="#c44" font-size="9" font-weight="700" text-anchor="middle">Network Partition</text><text x="260" y="203" fill="#555" font-size="8.5" text-anchor="middle">Split cluster into partitions;</text><text x="260" y="215" fill="#555" font-size="8.5" text-anchor="middle">test collective comm failure</text><rect width="130" height="55" x="340" y="170" fill="#f9d6d5" stroke="#c44" stroke-width="1"/><text x="405" y="188" fill="#c44" font-size="9" font-weight="700" text-anchor="middle">Disk Full</text><text x="405" y="203" fill="#555" font-size="8.5" text-anchor="middle">Fill checkpoint storage;</text><text x="405" y="215" fill="#555" font-size="8.5" text-anchor="middle">test graceful degradation</text><rect width="150" height="55" x="485" y="170" fill="#f9d6d5" stroke="#c44" stroke-width="1"/><text x="560" y="188" fill="#c44" font-size="9" font-weight="700" text-anchor="middle">Inject Bit Corruption</text><text x="560" y="203" fill="#555" font-size="8.5" text-anchor="middle">Flip bits in weights/grads;</text><text x="560" y="215" fill="#555" font-size="8.5" text-anchor="middle">test SDC detection pipeline</text><rect width="585" height="44" x="50" y="240" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/><text x="342.5" y="258" fill="#333" font-size="9.5" font-weight="700" text-anchor="middle">Gate Checks (must all pass to proceed)</text><text x="155" y="274" fill="#555" font-size="8.5" text-anchor="middle">Recovery &lt; SLA timeout</text><text x="310" y="274" fill="#555" font-size="8.5" text-anchor="middle">No data loss beyond last ckpt</text><text x="480" y="274" fill="#555" font-size="8.5" text-anchor="middle">Accuracy within tolerance</text><rect width="300" height="105" x="30" y="318" fill="#fff" stroke="#c87b2a" stroke-width="1.2"/><text x="180" y="338" fill="#c87b2a" font-size="11" font-weight="700" text-anchor="middle">Staging (Shadow Traffic)</text><text x="50" y="358" fill="#555" font-size="9">• Mirror production requests to new model</text><text x="50" y="374" fill="#555" font-size="9">• Compare responses (no user-visible impact)</text><text x="50" y="390" fill="#555" font-size="9">• Measure latency, throughput, accuracy drift</text><text x="50" y="406" fill="#555" font-size="9">• Validate checkpoint load and failover paths</text><line x1="496" x2="180" y1="95" y2="316" stroke="#c87b2a" stroke-dasharray="4 3" stroke-width="1"/><rect width="300" height="105" x="350" y="318" fill="#fff" stroke="#3d9e5a" stroke-width="1.2"/><text x="500" y="338" fill="#3d9e5a" font-size="11" font-weight="700" text-anchor="middle">Canary → Production</text><text x="370" y="358" fill="#555" font-size="9">• Route 1% traffic to new model (canary)</text><text x="370" y="374" fill="#555" font-size="9">• Monitor error rate, p99 latency, loss</text><text x="370" y="390" fill="#555" font-size="9">• Auto-rollback if metrics degrade</text><text x="370" y="406" fill="#555" font-size="9">• Gradual ramp: 1% → 5% → 25% → 100%</text><line x1="576" x2="500" y1="95" y2="316" stroke="#3d9e5a" stroke-dasharray="4 3" stroke-width="1"/><text x="340" y="450" fill="#999" font-size="9" font-style="italic" text-anchor="middle">ML systems CI/CD pipeline with dedicated fault injection and progressive rollout stages</text></svg>