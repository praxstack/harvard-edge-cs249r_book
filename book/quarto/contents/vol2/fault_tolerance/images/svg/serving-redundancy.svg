<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 800 500"><defs><marker id="arrowBlk" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#333" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arrowGrn" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#3d9e5a" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arrowOr" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#c87b2a" d="M0,0 L8,3 L0,6 Z"/></marker></defs><rect width="800" height="500" fill="#fff"/><line x1="400" x2="400" y1="30" y2="470" stroke="#bbb" stroke-dasharray="6 4" stroke-width="1.5"/><text x="200" y="30" fill="#333" font-size="12" font-weight="700" text-anchor="middle">Active-Active</text><line x1="200" x2="200" y1="40" y2="70" stroke="#333" stroke-width="1.5" marker-end="url(#arrowBlk)"/><text x="160" y="55" fill="#555" font-size="8.5">traffic</text><rect width="140" height="40" x="130" y="70" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="200" y="85" fill="#4a90c4" font-size="11" font-weight="700" text-anchor="middle">Load Balancer</text><text x="200" y="100" fill="#4a90c4" font-size="8.5" text-anchor="middle">round-robin / weighted</text><path fill="none" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arrowGrn)" d="M160,110 L160,130 L80,130 L80,150"/><path fill="none" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arrowGrn)" d="M200,110 L200,150"/><path fill="none" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arrowGrn)" d="M240,110 L240,130 L320,130 L320,150"/><text x="90" y="145" fill="#3d9e5a" font-size="8">~33%</text><text x="210" y="145" fill="#3d9e5a" font-size="8">~33%</text><text x="330" y="145" fill="#3d9e5a" font-size="8">~33%</text><rect width="100" height="50" x="30" y="150" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/><text x="80" y="170" fill="#3d9e5a" font-size="10" font-weight="600" text-anchor="middle">Replica 1</text><text x="80" y="185" fill="#3d9e5a" font-size="8.5" text-anchor="middle">active</text><rect width="100" height="50" x="150" y="150" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/><text x="200" y="170" fill="#3d9e5a" font-size="10" font-weight="600" text-anchor="middle">Replica 2</text><text x="200" y="185" fill="#3d9e5a" font-size="8.5" text-anchor="middle">active</text><rect width="100" height="50" x="270" y="150" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/><text x="320" y="170" fill="#3d9e5a" font-size="10" font-weight="600" text-anchor="middle">Replica 3</text><text x="320" y="185" fill="#3d9e5a" font-size="8.5" text-anchor="middle">active</text><path fill="none" stroke="#3d9e5a" stroke-dasharray="4 3" stroke-width="1.2" marker-end="url(#arrowGrn)" d="M80,200 L80,240"/><path fill="none" stroke="#3d9e5a" stroke-dasharray="4 3" stroke-width="1.2" marker-end="url(#arrowGrn)" d="M200,200 L200,240"/><path fill="none" stroke="#3d9e5a" stroke-dasharray="4 3" stroke-width="1.2" marker-end="url(#arrowGrn)" d="M320,200 L320,240"/><rect width="340" height="60" x="30" y="240" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.2"/><text x="200" y="260" fill="#3d9e5a" font-size="10" font-weight="700" text-anchor="middle">Higher utilization</text><text x="200" y="275" fill="#3d9e5a" font-size="9" text-anchor="middle">All replicas serve traffic simultaneously</text><text x="200" y="290" fill="#3d9e5a" font-size="8.5" text-anchor="middle">No idle capacity — cost efficient</text><rect width="340" height="60" x="30" y="320" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.2"/><text x="200" y="340" fill="#c87b2a" font-size="9" font-weight="600" text-anchor="middle">Trade-off:</text><text x="200" y="355" fill="#c87b2a" font-size="8.5" text-anchor="middle">Failover adds rebalancing latency.</text><text x="200" y="370" fill="#c87b2a" font-size="8.5" text-anchor="middle">Load spikes if 1 replica fails.</text><text x="600" y="30" fill="#333" font-size="12" font-weight="700" text-anchor="middle">Active-Passive</text><line x1="600" x2="600" y1="40" y2="70" stroke="#333" stroke-width="1.5" marker-end="url(#arrowBlk)"/><text x="560" y="55" fill="#555" font-size="8.5">traffic</text><rect width="140" height="40" x="530" y="70" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="600" y="85" fill="#4a90c4" font-size="11" font-weight="700" text-anchor="middle">Load Balancer</text><text x="600" y="100" fill="#4a90c4" font-size="8.5" text-anchor="middle">monitors primary health</text><line x1="600" x2="600" y1="110" y2="150" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arrowGrn)"/><text x="615" y="135" fill="#3d9e5a" font-size="8">100%</text><path fill="none" stroke="#999" stroke-dasharray="3 3" stroke-width=".8" d="M540,110 L540,120 L490,120 L490,240"/><path fill="none" stroke="#999" stroke-dasharray="3 3" stroke-width=".8" d="M660,110 L660,120 L710,120 L710,240"/><text x="485" y="180" fill="#999" font-size="7.5" font-style="italic" text-anchor="end">health</text><text x="485" y="195" fill="#999" font-size="7.5" font-style="italic" text-anchor="end">check</text><path fill="none" stroke="#c87b2a" stroke-dasharray="6 3" stroke-width="1.5" marker-end="url(#arrowOr)" d="M560,110 L560,130 L520,130 L520,240"/><text x="525" y="215" fill="#c87b2a" font-size="8" font-weight="700">failover</text><rect width="100" height="50" x="550" y="150" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/><text x="600" y="170" fill="#3d9e5a" font-size="10" font-weight="600" text-anchor="middle">Primary</text><text x="600" y="185" fill="#3d9e5a" font-size="8.5" text-anchor="middle">active — all traffic</text><circle cx="650" cy="150" r="14" fill="#f9d6d5" stroke="#c44" stroke-width="1.5"/><text x="650" y="154.5" fill="#c44" font-size="12" font-weight="700" text-anchor="middle">✕</text><rect width="100" height="50" x="470" y="240" fill="#e8e8e8" stroke="#999" stroke-width="1.5"/><text x="520" y="260" fill="#555" font-size="9.5" font-weight="600" text-anchor="middle">Standby 1</text><text x="520" y="275" fill="#999" font-size="8" text-anchor="middle">idle — warm</text><rect width="100" height="50" x="630" y="240" fill="#e8e8e8" stroke="#999" stroke-width="1.5"/><text x="680" y="260" fill="#555" font-size="9.5" font-weight="600" text-anchor="middle">Standby 2</text><text x="680" y="275" fill="#999" font-size="8" text-anchor="middle">idle — warm</text><rect width="110" height="30" x="465" y="300" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.2"/><text x="520" y="314" fill="#c87b2a" font-size="9" font-weight="700" text-anchor="middle">Instant failover</text><text x="520" y="324" fill="#c87b2a" font-size="8" text-anchor="middle">standby promoted</text><rect width="340" height="50" x="430" y="340" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.2"/><text x="600" y="360" fill="#c87b2a" font-size="10" font-weight="700" text-anchor="middle">Instant failover</text><text x="600" y="375" fill="#c87b2a" font-size="9" text-anchor="middle">Standby replicas immediately take over</text><rect width="340" height="40" x="430" y="400" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.2"/><text x="600" y="418" fill="#c87b2a" font-size="9" font-weight="600" text-anchor="middle">Trade-off: lower utilization</text><text x="600" y="430" fill="#c87b2a" font-size="8.5" text-anchor="middle">Standby capacity is reserved but idle</text><text x="400" y="470" fill="#999" font-size="9" font-style="italic" text-anchor="middle">Active-active preferred for inference throughput; active-passive preferred for deterministic failover SLOs</text></svg>