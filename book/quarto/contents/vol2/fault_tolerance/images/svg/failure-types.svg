<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 880 520"><rect width="880" height="520" fill="#fff"/><defs><marker id="arrowBlue" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#4a90c4" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arrowGray" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#bbb" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arrowRed" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#c44" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arrowOrange" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#c87b2a" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arrowGreen" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#3d9e5a" d="M0,0 L8,3 L0,6 Z"/></marker></defs><line x1="440" x2="440" y1="20" y2="390" stroke="#bbb" stroke-dasharray="6 4" stroke-width="1.5"/><text x="220" y="44" fill="#333" font-size="12" font-weight="700" text-anchor="middle">Fail-Stop Failure</text><rect width="120" height="40" x="160" y="60" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="220" y="79" fill="#4a90c4" font-size="11" font-weight="600" text-anchor="middle">Coordinator</text><text x="220" y="93" fill="#4a90c4" font-size="9" text-anchor="middle">timeout detector</text><rect width="80" height="70" x="30" y="180" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/><text x="70" y="211" fill="#3d9e5a" font-size="10" font-weight="600" text-anchor="middle">Worker 1</text><text x="70" y="225" fill="#3d9e5a" font-size="8" text-anchor="middle">running</text><rect width="80" height="70" x="130" y="180" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5"/><line x1="158" x2="182" y1="185" y2="209" stroke="#c44" stroke-width="2.5"/><line x1="182" x2="158" y1="185" y2="209" stroke="#c44" stroke-width="2.5"/><text x="170" y="223" fill="#555" font-size="10" font-weight="600" text-anchor="middle">Worker 2</text><text x="170" y="237" fill="#999" font-size="8" text-anchor="middle">silent / dead</text><rect width="80" height="70" x="230" y="180" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/><text x="270" y="211" fill="#3d9e5a" font-size="10" font-weight="600" text-anchor="middle">Worker 3</text><text x="270" y="225" fill="#3d9e5a" font-size="8" text-anchor="middle">running</text><rect width="80" height="70" x="330" y="180" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/><text x="370" y="211" fill="#3d9e5a" font-size="10" font-weight="600" text-anchor="middle">Worker 4</text><text x="370" y="225" fill="#3d9e5a" font-size="8" text-anchor="middle">running</text><path fill="none" stroke="#4a90c4" stroke-dasharray="5 3" stroke-width="1.5" marker-end="url(#arrowBlue)" d="M70,180 L70,120 L190,120 L190,100"/><text x="130" y="115" fill="#4a90c4" font-size="8" text-anchor="middle">heartbeat</text><path fill="none" stroke="#c44" stroke-dasharray="3 3" stroke-width="1.5" d="M170,180 L170,150 L210,150 L210,100"/><text x="165" y="165" fill="#c44" font-size="8" font-style="italic" text-anchor="end">timeout!</text><path fill="none" stroke="#4a90c4" stroke-dasharray="5 3" stroke-width="1.5" marker-end="url(#arrowBlue)" d="M270,180 L270,150 L230,150 L230,100"/><path fill="none" stroke="#4a90c4" stroke-dasharray="5 3" stroke-width="1.5" marker-end="url(#arrowBlue)" d="M370,180 L370,120 L250,120 L250,100"/><rect width="180" height="34" x="130" y="280" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/><text x="220" y="296" fill="#c87b2a" font-size="9" text-anchor="middle">Coordinator detects missing</text><text x="220" y="308" fill="#c87b2a" font-size="9" text-anchor="middle">heartbeat → failure declared</text><rect width="380" height="52" x="30" y="335" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="220" y="353" fill="#4a90c4" font-size="9.5" font-weight="700" text-anchor="middle">Key property:</text><text x="220" y="367" fill="#333" font-size="9" text-anchor="middle">Component stops responding entirely.</text><text x="220" y="379" fill="#333" font-size="9" text-anchor="middle">Detection: timeout. Recovery: replace + checkpoint.</text><text x="660" y="44" fill="#333" font-size="12" font-weight="700" text-anchor="middle">Byzantine Failure</text><rect width="120" height="40" x="600" y="60" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="660" y="79" fill="#4a90c4" font-size="11" font-weight="600" text-anchor="middle">Coordinator</text><text x="660" y="93" fill="#4a90c4" font-size="9" text-anchor="middle">receives all gradients</text><rect width="80" height="70" x="470" y="180" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/><text x="510" y="211" fill="#3d9e5a" font-size="10" font-weight="600" text-anchor="middle">Worker 5</text><text x="510" y="225" fill="#3d9e5a" font-size="8" text-anchor="middle">correct ∇</text><rect width="80" height="70" x="570" y="180" fill="#fdebd0" stroke="#c87b2a" stroke-width="2"/><text x="610" y="201" fill="#c87b2a" font-size="10" font-weight="600" text-anchor="middle">Worker 6</text><text x="610" y="215" fill="#c87b2a" font-size="8" text-anchor="middle">appears healthy!</text><text x="610" y="229" fill="#c44" font-size="8" text-anchor="middle">corrupt output</text><rect width="80" height="70" x="670" y="180" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/><text x="710" y="211" fill="#3d9e5a" font-size="10" font-weight="600" text-anchor="middle">Worker 7</text><text x="710" y="225" fill="#3d9e5a" font-size="8" text-anchor="middle">correct ∇</text><rect width="80" height="70" x="770" y="180" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/><text x="810" y="211" fill="#3d9e5a" font-size="10" font-weight="600" text-anchor="middle">Worker 8</text><text x="810" y="225" fill="#3d9e5a" font-size="8" text-anchor="middle">correct ∇</text><path fill="none" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arrowGreen)" d="M510,180 L510,120 L630,120 L630,100"/><path fill="none" stroke="#c44" stroke-dasharray="5 3" stroke-width="1.5" marker-end="url(#arrowRed)" d="M610,180 L610,150 L650,150 L650,100"/><text x="605" y="160" fill="#c44" font-size="8" font-weight="700" text-anchor="end">poison ∇</text><text x="605" y="172" fill="#c87b2a" font-size="7.5" font-style="italic" text-anchor="end">(passes sanity check)</text><path fill="none" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arrowGreen)" d="M710,180 L710,150 L670,150 L670,100"/><path fill="none" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arrowGreen)" d="M810,180 L810,120 L690,120 L690,100"/><rect width="180" height="34" x="570" y="280" fill="#f9d6d5" stroke="#c44" stroke-width="1.5"/><text x="660" y="296" fill="#c44" font-size="9" text-anchor="middle">No timeout triggered —</text><text x="660" y="308" fill="#c44" font-size="9" text-anchor="middle">failure is invisible to coordinator</text><rect width="380" height="52" x="470" y="335" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/><text x="660" y="353" fill="#c87b2a" font-size="9.5" font-weight="700" text-anchor="middle">Key property:</text><text x="660" y="367" fill="#333" font-size="9" text-anchor="middle">Component sends wrong results but stays alive.</text><text x="660" y="379" fill="#333" font-size="9" text-anchor="middle">Detection requires checksum / cross-validation.</text><rect width="820" height="60" x="30" y="410" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5"/><text x="440" y="429" fill="#333" font-size="10" font-weight="700" text-anchor="middle">Critical Distinction</text><text x="220" y="446" fill="#4a90c4" font-size="9" text-anchor="middle">Fail-stop: absence of signal = failure</text><text x="220" y="460" fill="#4a90c4" font-size="9" text-anchor="middle">Simple timeout detection is sufficient</text><line x1="440" x2="440" y1="415" y2="465" stroke="#bbb" stroke-width="1.5"/><text x="660" y="446" fill="#c87b2a" font-size="9" text-anchor="middle">Byzantine: presence of signal ≠ correctness</text><text x="660" y="460" fill="#c87b2a" font-size="9" text-anchor="middle">Requires gradient checksums or redundant compute</text><text x="440" y="495" fill="#999" font-size="9" font-style="italic" text-anchor="middle">Byzantine term from Lamport et al. (1982): generals who may defect and send contradictory messages to confuse consensus</text></svg>