<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 640 430"><defs><style>.axis{stroke:#333;stroke-width:1.2;fill:none}.grid{stroke:#e8e8e8;stroke-width:.8}.tick-label,.y-label{font-size:10px;fill:#555;text-anchor:middle}.y-label{text-anchor:end}.axis-title{font-size:11px;fill:#333;font-weight:600}.data-line{fill:none;stroke:#a31f34;stroke-width:2.5;stroke-linejoin:round}.data-dot{fill:#a31f34;stroke:#fff;stroke-width:2}.gpu-label{font-size:9.5px;fill:#333;font-weight:600;text-anchor:middle}.gpu-value{font-size:8.5px;fill:#777}.gpu-value,.subtitle,.title{text-anchor:middle}.title{font-size:14px;font-weight:700;fill:#333}.subtitle{font-size:10.5px;fill:#777}.annotation{font-size:9px;fill:#a31f34}.era-bg{fill:rgba(163,31,52,.04)}.era-label{font-size:8.5px;fill:#a31f34;text-anchor:middle;font-weight:600;letter-spacing:.5px}</style><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="#a31f34" d="M 0 1 L 10 5 L 0 9 z"/></marker></defs><text x="340" y="28" class="title">NVIDIA GPU Inference Performance</text><text x="340" y="44" class="subtitle">Peak Throughput (TOPS / TFLOP/s), logarithmic scale</text><line x1="80" x2="600" y1="340" y2="340" class="grid"/><line x1="80" x2="600" y1="270" y2="270" class="grid"/><line x1="80" x2="600" y1="200" y2="200" class="grid"/><line x1="80" x2="600" y1="130" y2="130" class="grid"/><line x1="80" x2="600" y1="60" y2="60" class="grid"/><text x="72" y="344" class="y-label">1</text><text x="72" y="274" class="y-label">10</text><text x="72" y="204" class="y-label">100</text><text x="72" y="134" class="y-label">1,000</text><text x="72" y="64" class="y-label">10,000</text><text x="20" y="200" class="axis-title" text-anchor="middle" transform="rotate(-90,20,200)">PEAK PERFORMANCE (TOPS / TFLOP/s)</text><rect width="220" height="280" x="80" y="60" class="era-bg" opacity=".5"/><text x="190" y="52" class="era-label">SCALAR / VECTOR</text><rect width="300" height="280" x="300" y="60" fill="rgba(163,31,52,0.07)"/><text x="450" y="52" class="era-label">TENSOR CORES (SPARSE)</text><line x1="300" x2="300" y1="60" y2="340" stroke="#a31f34" stroke-width="1.2"/><line x1="80" x2="600" y1="340" y2="340" class="axis"/><line x1="80" x2="80" y1="60" y2="340" class="axis"/><polyline points="120 298.6 200 281.7 280 223 320 193.2 440 123.3 520 87.9" class="data-line"/><circle cx="120" cy="298.6" r="5" class="data-dot"/><text x="120" y="322" class="gpu-label">K20X</text><text x="120" y="332" class="gpu-value">3.9 TFLOP/s</text><text x="120" y="355" class="tick-label">2012</text><circle cx="200" cy="281.7" r="5" class="data-dot"/><text x="190" y="271" class="gpu-label" text-anchor="end">M40</text><text x="190" y="261" class="gpu-value" text-anchor="end">6.8 TOPS</text><text x="200" y="355" class="tick-label">2014</text><circle cx="280" cy="223" r="5" class="data-dot"/><text x="270" y="213" class="gpu-label" text-anchor="end">P40</text><text x="270" y="203" class="gpu-value" text-anchor="end">47 TOPS</text><text x="280" y="355" class="tick-label">2016</text><circle cx="320" cy="193.2" r="5" class="data-dot"/><text x="330" y="183" class="gpu-label" text-anchor="start">V100</text><text x="330" y="173" class="gpu-value" text-anchor="start">125 TOPS</text><text x="320" y="355" class="tick-label">2017</text><circle cx="440" cy="123.3" r="5" class="data-dot"/><text x="430" y="113" class="gpu-label" text-anchor="end">A100</text><text x="430" y="103" class="gpu-value" text-anchor="end">1,248 TOPS</text><text x="440" y="355" class="tick-label">2020</text><circle cx="520" cy="87.9" r="5" class="data-dot"/><text x="520" y="77" class="gpu-label">H100</text><text x="520" y="67" class="gpu-value">4,000 TFLOP/s</text><text x="520" y="355" class="tick-label">2022</text><line x1="560" x2="560" y1="298.6" y2="87.9" stroke="#a31f34" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="570" y="196" class="annotation" font-size="13" font-weight="700" text-anchor="start">1,000x</text><text x="340" y="380" class="axis-title" text-anchor="middle">Year</text><text x="340" y="405" fill="#999" font-size="9" text-anchor="middle">Architectural shift from general-purpose floating-point to dedicated tensor core acceleration</text></svg>