<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 680 460"><rect width="680" height="460" fill="#fff" rx="4"/><defs><marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#555" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arrow-red" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#a31f34" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arrow-green" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#3d9e5a" d="M0,0 L8,3 L0,6 Z"/></marker></defs><text x="340" y="24" fill="#333" font-size="13" font-weight="700" text-anchor="middle">How One Hardware Constraint Reshaped an Entire Architecture</text><rect width="300" height="48" x="190" y="38" fill="#f9d6d5" stroke="#c44" stroke-width="1.5" rx="4"/><text x="340" y="57" fill="#333" font-size="11" font-weight="700" text-anchor="middle">H800: NVLink Bandwidth Cut 56%</text><text x="340" y="72" fill="#555" font-size="9" text-anchor="middle">400 GB/s vs H100&apos;s 900 GB/s (US export controls)</text><text x="170" y="104" fill="#a31f34" font-size="7.5" font-weight="700" text-anchor="middle">MACHINE → ALGORITHM</text><text x="340" y="100" fill="#a31f34" font-size="7.5" font-weight="700" text-anchor="middle">MACHINE → DATA</text><text x="510" y="104" fill="#a31f34" font-size="7.5" font-weight="700" text-anchor="middle">ALGORITHM → DATA</text><line x1="260" x2="130" y1="86" y2="120" stroke="#c44" stroke-width="1.2" marker-end="url(#arrow-red)"/><line x1="340" x2="340" y1="86" y2="120" stroke="#c44" stroke-width="1.2" marker-end="url(#arrow-red)"/><line x1="420" x2="550" y1="86" y2="120" stroke="#c44" stroke-width="1.2" marker-end="url(#arrow-red)"/><rect width="200" height="88" x="30" y="128" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5" rx="4"/><text x="130" y="148" fill="#333" font-size="10" font-weight="700" text-anchor="middle">Mixture-of-Experts</text><text x="130" y="164" fill="#555" font-size="9" text-anchor="middle">671B total parameters</text><text x="130" y="178" fill="#555" font-size="9" text-anchor="middle">37B active per token</text><line x1="55" x2="205" y1="187" y2="187" stroke="#4a90c4" stroke-dasharray="3 2" stroke-width=".5"/><text x="130" y="201" fill="#555" font-size="8.5" text-anchor="middle">Avoided costly tensor parallelism;</text><text x="130" y="212" fill="#555" font-size="8.5" text-anchor="middle">less data movement per pass</text><rect width="180" height="88" x="250" y="128" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5" rx="4"/><text x="340" y="148" fill="#333" font-size="10" font-weight="700" text-anchor="middle">FP8 Training</text><text x="340" y="164" fill="#555" font-size="9" text-anchor="middle">8-bit instead of BF16</text><text x="340" y="178" fill="#555" font-size="9" text-anchor="middle">2× effective bandwidth</text><line x1="275" x2="405" y1="187" y2="187" stroke="#4a90c4" stroke-dasharray="3 2" stroke-width=".5"/><text x="340" y="201" fill="#555" font-size="8.5" text-anchor="middle">Halves memory footprint;</text><text x="340" y="212" fill="#555" font-size="8.5" text-anchor="middle">required new data engineering</text><rect width="200" height="88" x="450" y="128" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5" rx="4"/><text x="550" y="148" fill="#333" font-size="10" font-weight="700" text-anchor="middle">Multi-head Latent Attention</text><text x="550" y="164" fill="#555" font-size="9" text-anchor="middle">KV cache compressed &gt;98%</text><text x="550" y="178" fill="#555" font-size="9" text-anchor="middle">576 vs 32,768 elements/token</text><line x1="475" x2="625" y1="187" y2="187" stroke="#4a90c4" stroke-dasharray="3 2" stroke-width=".5"/><text x="550" y="201" fill="#555" font-size="8.5" text-anchor="middle">Fewer bytes per token;</text><text x="550" y="212" fill="#555" font-size="8.5" text-anchor="middle">faster, cheaper inference</text><line x1="130" x2="230" y1="224" y2="262" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/><line x1="340" x2="340" y1="224" y2="262" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/><line x1="550" x2="450" y1="224" y2="262" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/><rect width="360" height="56" x="160" y="268" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5" rx="4"/><text x="340" y="288" fill="#333" font-size="10" font-weight="700" text-anchor="middle">DeepSeek V3: 2,048 H800 GPUs · 2.79M GPU-hours · 14.8T tokens</text><text x="340" y="304" fill="#555" font-size="9" text-anchor="middle">Matched GPT-4 on most benchmarks</text><text x="340" y="318" fill="#3d9e5a" font-size="8" text-anchor="middle">Source: DeepSeek-V3 Technical Report, Table 1 (arXiv 2412.19437)</text><line x1="340" x2="340" y1="324" y2="354" stroke="#3d9e5a" stroke-width="1.2" marker-end="url(#arrow-green)"/><rect width="86" height="40" x="100" y="360" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5" rx="4"/><text x="143" y="379" fill="#333" font-size="10" font-weight="700" text-anchor="middle">$5.576M</text><text x="143" y="393" fill="#555" font-size="7.5" text-anchor="middle">DeepSeek V3</text><rect width="370" height="40" x="210" y="360" fill="#f9d6d5" stroke="#c44" stroke-width="1.5" rx="4"/><text x="395" y="379" fill="#333" font-size="10" font-weight="700" text-anchor="middle">$100M+ (estimated)</text><text x="395" y="393" fill="#555" font-size="7.5" text-anchor="middle">GPT-4 training cost</text><text x="340" y="420" fill="#a31f34" font-size="9" font-weight="700" text-anchor="middle">~18× cost difference</text><text x="340" y="448" fill="#999" font-size="9" font-style="italic" text-anchor="middle">One hardware constraint cascaded into three innovations that redefined cost-efficiency.</text></svg>