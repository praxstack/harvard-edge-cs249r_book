<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" viewBox="0 0 900 500"><rect width="900" height="500" fill="#fff"/><defs><marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#555" d="M0,0 L8,3 L0,6 Z"/></marker></defs><text x="450" y="30" fill="#333" font-size="13" font-weight="700" text-anchor="middle">The Fleet Law: Decomposing Distributed Training Time</text><rect width="740" height="80" x="80" y="70" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/><rect width="350" height="80" x="80" y="70" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="255" y="105" fill="#333" font-size="12" font-weight="700" text-anchor="middle">T_Compute</text><text x="255" y="125" fill="#555" font-size="9" text-anchor="middle">Forward + Backward passes</text><text x="255" y="142" fill="#4a90c4" font-size="9" text-anchor="middle">47%</text><rect width="260" height="80" x="430" y="70" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/><text x="560" y="105" fill="#333" font-size="12" font-weight="700" text-anchor="middle">T_Communication</text><text x="560" y="125" fill="#555" font-size="9" text-anchor="middle">Gradient sync, AllReduce</text><text x="560" y="142" fill="#3d9e5a" font-size="9" text-anchor="middle">38%</text><rect width="130" height="80" x="690" y="70" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/><text x="755" y="105" fill="#333" font-size="11" font-weight="700" text-anchor="middle">T_Coord</text><text x="755" y="125" fill="#555" font-size="9" text-anchor="middle">Barriers</text><text x="755" y="142" fill="#c87b2a" font-size="9" text-anchor="middle">15%</text><line x1="80" x2="820" y1="165" y2="165" stroke="#333" stroke-width="1.5"/><line x1="80" x2="80" y1="155" y2="165" stroke="#333" stroke-width="1.5"/><line x1="820" x2="820" y1="155" y2="165" stroke="#333" stroke-width="1.5"/><text x="450" y="185" fill="#333" font-size="11" font-weight="700" text-anchor="middle">T_step = T_Compute + T_Communication + T_Coordination</text><rect width="500" height="55" x="200" y="210" fill="#f7f7f7" stroke="#a31f34" stroke-width="1.5"/><text x="450" y="235" fill="#a31f34" font-size="12" font-weight="700" text-anchor="middle">η_fleet = T_Compute / T_step</text><text x="450" y="255" fill="#555" font-size="9" text-anchor="middle">When η_fleet &lt; 0.5, more than half the silicon sits idle</text><rect width="240" height="90" x="60" y="290" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="180" y="315" fill="#4a90c4" font-size="10" font-weight="700" text-anchor="middle">Compute-Dominated</text><text x="180" y="335" fill="#555" font-size="9" text-anchor="middle">T_Compute &gt;&gt; T_Comm + T_Coord</text><text x="180" y="355" fill="#3d9e5a" font-size="9" font-weight="700" text-anchor="middle">Fleet is doing its job</text><text x="180" y="372" fill="#555" font-size="8" text-anchor="middle">η_fleet &gt; 0.7</text><rect width="240" height="90" x="330" y="290" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/><text x="450" y="315" fill="#3d9e5a" font-size="10" font-weight="700" text-anchor="middle">Communication-Dominated</text><text x="450" y="335" fill="#555" font-size="9" text-anchor="middle">T_Comm &gt;&gt; T_Compute</text><text x="450" y="355" fill="#c44" font-size="9" font-weight="700" text-anchor="middle">Upgrade interconnect / overlap</text><text x="450" y="372" fill="#555" font-size="8" text-anchor="middle">η_fleet &lt; 0.5</text><rect width="240" height="90" x="600" y="290" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/><text x="720" y="315" fill="#c87b2a" font-size="10" font-weight="700" text-anchor="middle">Coordination-Dominated</text><text x="720" y="335" fill="#555" font-size="9" text-anchor="middle">T_Coord &gt;&gt; T_Compute</text><text x="720" y="355" fill="#c44" font-size="9" font-weight="700" text-anchor="middle">Reduce barriers / go async</text><text x="720" y="372" fill="#555" font-size="8" text-anchor="middle">η_fleet &lt; 0.3</text><text x="450" y="415" fill="#333" font-size="10" font-weight="700" text-anchor="middle">Example: GPT-3 on InfiniBand (200 Gbps)</text><rect width="300" height="25" x="120" y="425" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1"/><rect width="240" height="25" x="420" y="425" fill="#d4edda" stroke="#3d9e5a" stroke-width="1"/><rect width="60" height="25" x="660" y="425" fill="#fdebd0" stroke="#c87b2a" stroke-width="1"/><text x="270" y="442" fill="#4a90c4" font-size="8" font-weight="700" text-anchor="middle">Compute: ~50%</text><text x="540" y="442" fill="#3d9e5a" font-size="8" font-weight="700" text-anchor="middle">Comm: ~40%</text><text x="690" y="442" fill="#c87b2a" font-size="8" font-weight="700" text-anchor="middle">~10%</text><text x="450" y="485" fill="#999" font-size="9" font-style="italic" text-anchor="middle">Diagnostic instrument: identify which C dominates, then optimize that dimension</text></svg>