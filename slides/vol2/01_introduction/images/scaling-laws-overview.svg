<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" viewBox="0 0 900 500"><rect width="900" height="500" fill="#fff"/><text x="450" y="30" fill="#333" font-size="13" font-weight="700" text-anchor="middle">AI Scaling Laws: Performance Follows Power-Law Relationships</text><rect width="400" height="380" x="30" y="50" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/><line x1="80" x2="400" y1="400" y2="400" stroke="#bbb" stroke-width="1.5"/><line x1="80" x2="80" y1="80" y2="400" stroke="#bbb" stroke-width="1.5"/><text x="240" y="435" fill="#555" font-size="9" text-anchor="middle">Compute / Data / Parameters (log scale)</text><text x="42" y="240" fill="#555" font-size="9" text-anchor="middle" transform="rotate(-90,42,240)">Loss (log scale)</text><path fill="none" stroke="#4a90c4" stroke-width="2.5" d="M90,100 C120,120 160,180 200,240 C240,290 280,330 340,360 C370,375 400,385 410,390"/><line x1="90" x2="200" y1="100" y2="100" stroke="#c44" stroke-dasharray="4 2" stroke-width=".8"/><line x1="310" x2="410" y1="350" y2="350" stroke="#c44" stroke-dasharray="4 2" stroke-width=".8"/><rect width="80" height="22" x="100" y="105" fill="#d4edda" stroke="#3d9e5a" stroke-width="1"/><text x="140" y="120" fill="#3d9e5a" font-size="7.5" font-weight="700" text-anchor="middle">High Return</text><rect width="100" height="22" x="290" y="335" fill="#f9d6d5" stroke="#c44" stroke-width="1"/><text x="340" y="350" fill="#c44" font-size="7.5" font-weight="700" text-anchor="middle">Diminishing</text><text x="230" y="80" fill="#333" font-size="10" font-weight="700" text-anchor="middle">L(X) = A·X^(−α) + B</text><text x="670" y="65" fill="#333" font-size="11" font-weight="700" text-anchor="middle">Three Scaling Dimensions</text><rect width="380" height="75" x="480" y="90" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="670" y="113" fill="#4a90c4" font-size="10" font-weight="700" text-anchor="middle">Parameters (N)</text><text x="670" y="133" fill="#555" font-size="8.5" text-anchor="middle">Model capacity: 117M (GPT-1) → 175B (GPT-3) → ~1T (GPT-4)</text><text x="670" y="153" fill="#555" font-size="8" text-anchor="middle">Each 10× increase ≈ step-function improvement in capability</text><rect width="380" height="75" x="480" y="180" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/><text x="670" y="203" fill="#3d9e5a" font-size="10" font-weight="700" text-anchor="middle">Data (D)</text><text x="670" y="223" fill="#555" font-size="8.5" text-anchor="middle">Dataset size: Chinchilla optimality D ∝ N^0.74</text><text x="670" y="243" fill="#555" font-size="8" text-anchor="middle">Must grow proportionally — imbalance → overfitting</text><rect width="380" height="75" x="480" y="270" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/><text x="670" y="293" fill="#c87b2a" font-size="10" font-weight="700" text-anchor="middle">Compute (C)</text><text x="670" y="313" fill="#555" font-size="8.5" text-anchor="middle">Total FLOPs: 10¹⁸ (AlexNet) → 10²⁵ (GPT-4)</text><text x="670" y="333" fill="#555" font-size="8" text-anchor="middle">10× performance gain often requires 100–1000× more compute</text><rect width="380" height="60" x="480" y="370" fill="#fff" stroke="#a31f34" stroke-width="1.5"/><text x="670" y="393" fill="#a31f34" font-size="10" font-weight="700" text-anchor="middle">The Bitter Lesson (Sutton, 2019)</text><text x="670" y="413" fill="#555" font-size="8.5" text-anchor="middle">General methods that leverage computation ultimately</text><text x="670" y="428" fill="#555" font-size="8.5" text-anchor="middle">outperform methods that encode human expertise</text><text x="450" y="485" fill="#999" font-size="9" font-style="italic" text-anchor="middle">Scaling laws are diagnostic: they predict what resources a target capability level requires</text></svg>