<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" viewBox="0 0 900 500"><rect width="900" height="500" fill="#fff"/><text x="450" y="30" fill="#333" font-size="14" font-weight="700" text-anchor="middle">Pipelined Data Loading: Hiding Storage Latency</text><defs><marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#555" d="M0,0 L8,3 L0,6 Z"/></marker></defs><text x="450" y="60" fill="#c44" font-size="11" font-weight="700" text-anchor="middle">Without Pipelining (Sequential)</text><line x1="80" x2="820" y1="165" y2="165" stroke="#bbb" stroke-width="1"/><text x="50" y="100" fill="#333" font-size="9" font-weight="700" text-anchor="end">CPU</text><rect width="160" height="35" x="80" y="80" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/><text x="160" y="103" fill="#333" font-size="8" font-weight="700" text-anchor="middle">Load Batch 0</text><rect width="160" height="35" x="400" y="80" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/><text x="480" y="103" fill="#333" font-size="8" font-weight="700" text-anchor="middle">Load Batch 1</text><text x="50" y="145" fill="#333" font-size="9" font-weight="700" text-anchor="end">GPU</text><rect width="160" height="35" x="240" y="125" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="320" y="148" fill="#333" font-size="8" font-weight="700" text-anchor="middle">Train Batch 0</text><rect width="160" height="35" x="560" y="125" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="640" y="148" fill="#333" font-size="8" font-weight="700" text-anchor="middle">Train Batch 1</text><rect width="160" height="35" x="80" y="125" fill="#f9d6d5" stroke="#c44" stroke-dasharray="4 2" stroke-width="1"/><text x="160" y="148" fill="#c44" font-size="7" text-anchor="middle">GPU Idle</text><rect width="160" height="35" x="400" y="125" fill="#f9d6d5" stroke="#c44" stroke-dasharray="4 2" stroke-width="1"/><text x="480" y="148" fill="#c44" font-size="7" text-anchor="middle">GPU Idle</text><text x="160" y="180" fill="#555" font-size="7" text-anchor="middle">250 ms</text><text x="320" y="180" fill="#555" font-size="7" text-anchor="middle">200 ms</text><text x="480" y="180" fill="#555" font-size="7" text-anchor="middle">250 ms</text><text x="640" y="180" fill="#555" font-size="7" text-anchor="middle">200 ms</text><text x="730" y="100" fill="#c44" font-size="9" font-weight="700">T_step = 450 ms</text><text x="730" y="115" fill="#c44" font-size="8">55% stall!</text><line x1="80" x2="820" y1="210" y2="210" stroke="#e8e8e8" stroke-dasharray="6 3" stroke-width="1"/><text x="450" y="240" fill="#3d9e5a" font-size="11" font-weight="700" text-anchor="middle">With Pipelining (Overlapped)</text><line x1="80" x2="820" y1="365" y2="365" stroke="#bbb" stroke-width="1"/><text x="50" y="285" fill="#333" font-size="9" font-weight="700" text-anchor="end">CPU</text><rect width="180" height="35" x="80" y="265" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/><text x="170" y="288" fill="#333" font-size="8" font-weight="700" text-anchor="middle">Load Batch 1</text><rect width="180" height="35" x="260" y="265" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/><text x="350" y="288" fill="#333" font-size="8" font-weight="700" text-anchor="middle">Load Batch 2</text><rect width="180" height="35" x="440" y="265" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/><text x="530" y="288" fill="#333" font-size="8" font-weight="700" text-anchor="middle">Load Batch 3</text><text x="50" y="330" fill="#333" font-size="9" font-weight="700" text-anchor="end">GPU</text><rect width="180" height="35" x="80" y="310" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="170" y="333" fill="#333" font-size="8" font-weight="700" text-anchor="middle">Train Batch 0</text><rect width="180" height="35" x="260" y="310" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="350" y="333" fill="#333" font-size="8" font-weight="700" text-anchor="middle">Train Batch 1</text><rect width="180" height="35" x="440" y="310" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="530" y="333" fill="#333" font-size="8" font-weight="700" text-anchor="middle">Train Batch 2</text><rect width="0" height="0" x="260" y="345"/><rect width="0" height="35" x="260" y="310" fill="#d4edda" stroke="none" opacity=".3"/><text x="170" y="380" fill="#555" font-size="7" text-anchor="middle">250 ms</text><text x="350" y="380" fill="#555" font-size="7" text-anchor="middle">250 ms</text><text x="530" y="380" fill="#555" font-size="7" text-anchor="middle">250 ms</text><text x="730" y="290" fill="#3d9e5a" font-size="9" font-weight="700">T_step = 250 ms</text><text x="730" y="305" fill="#3d9e5a" font-size="8">20% stall</text><rect width="280" height="30" x="310" y="410" fill="#a31f34"/><text x="450" y="430" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">Pipelining: 450 ms to 250 ms (1.8x faster)</text><text x="450" y="475" fill="#999" font-size="9" font-style="italic" text-anchor="middle">Pipelining hides average latency; prefetch buffer depth must absorb tail latency variance</text></svg>