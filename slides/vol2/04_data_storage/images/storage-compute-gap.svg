<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" viewBox="0 0 900 500"><rect width="900" height="500" fill="#fff"/><text x="450" y="30" fill="#333" font-size="14" font-weight="700" text-anchor="middle">The Storage-Compute Gap</text><defs><marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#555" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arrow-red" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#a31f34" d="M0,0 L8,3 L0,6 Z"/></marker></defs><rect width="380" height="340" x="40" y="55" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/><text x="230" y="75" fill="#4a90c4" font-size="11" font-weight="700" text-anchor="middle">GPU Peak FP16 Throughput</text><rect width="50" height="60" x="80" y="280" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="105" y="305" fill="#333" font-size="8" font-weight="700" text-anchor="middle">21</text><text x="105" y="315" fill="#555" font-size="7" text-anchor="middle">TFLOPS</text><text x="105" y="360" fill="#555" font-size="8" text-anchor="middle">P100</text><text x="105" y="372" fill="#999" font-size="7" text-anchor="middle">2016</text><rect width="50" height="110" x="155" y="230" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="180" y="260" fill="#333" font-size="8" font-weight="700" text-anchor="middle">125</text><text x="180" y="270" fill="#555" font-size="7" text-anchor="middle">TFLOPS</text><text x="180" y="360" fill="#555" font-size="8" text-anchor="middle">V100</text><text x="180" y="372" fill="#999" font-size="7" text-anchor="middle">2018</text><rect width="50" height="165" x="230" y="175" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="255" y="205" fill="#333" font-size="8" font-weight="700" text-anchor="middle">312</text><text x="255" y="215" fill="#555" font-size="7" text-anchor="middle">TFLOPS</text><text x="255" y="360" fill="#555" font-size="8" text-anchor="middle">A100</text><text x="255" y="372" fill="#999" font-size="7" text-anchor="middle">2020</text><rect width="50" height="220" x="305" y="120" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/><text x="330" y="150" fill="#333" font-size="8" font-weight="700" text-anchor="middle">989</text><text x="330" y="160" fill="#555" font-size="7" text-anchor="middle">TFLOPS</text><text x="330" y="360" fill="#555" font-size="8" text-anchor="middle">H100</text><text x="330" y="372" fill="#999" font-size="7" text-anchor="middle">2022</text><text x="230" y="105" fill="#4a90c4" font-size="10" font-weight="700" text-anchor="middle">47x growth (2016-2022)</text><rect width="390" height="340" x="470" y="55" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/><text x="665" y="75" fill="#c87b2a" font-size="11" font-weight="700" text-anchor="middle">NVMe Sequential Read Bandwidth</text><rect width="50" height="60" x="530" y="280" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/><text x="555" y="305" fill="#333" font-size="8" font-weight="700" text-anchor="middle">3.5</text><text x="555" y="315" fill="#555" font-size="7" text-anchor="middle">GB/s</text><text x="555" y="360" fill="#555" font-size="8" text-anchor="middle">Gen 3</text><text x="555" y="372" fill="#999" font-size="7" text-anchor="middle">2016</text><rect width="50" height="75" x="620" y="265" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/><text x="645" y="295" fill="#333" font-size="8" font-weight="700" text-anchor="middle">7.0</text><text x="645" y="305" fill="#555" font-size="7" text-anchor="middle">GB/s</text><text x="645" y="360" fill="#555" font-size="8" text-anchor="middle">Gen 4</text><text x="645" y="372" fill="#999" font-size="7" text-anchor="middle">2020</text><rect width="50" height="92" x="710" y="248" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/><text x="735" y="280" fill="#333" font-size="8" font-weight="700" text-anchor="middle">14</text><text x="735" y="290" fill="#555" font-size="7" text-anchor="middle">GB/s</text><text x="735" y="360" fill="#555" font-size="8" text-anchor="middle">Gen 5</text><text x="735" y="372" fill="#999" font-size="7" text-anchor="middle">2024</text><text x="665" y="105" fill="#c87b2a" font-size="10" font-weight="700" text-anchor="middle">4x growth (2016-2024)</text><line x1="435" x2="435" y1="200" y2="370" stroke="#a31f34" stroke-dasharray="6 3" stroke-width="2"/><text x="435" y="420" fill="#a31f34" font-size="12" font-weight="700" text-anchor="middle">~500x Gap</text><text x="450" y="475" fill="#999" font-size="9" font-style="italic" text-anchor="middle">GPU throughput grows 10x faster than storage bandwidth, creating the I/O Wall</text></svg>